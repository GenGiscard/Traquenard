<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traquenard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#C9A06A; --ink:#2E2219; --paper:#F1E4C8; --card:#FBF3E1;
  --trap:#C2362F; --r1:#2F6FD6; --r2:#3C9E4A; --r3:#E58A1F;
  --rar0:#8A7F70; --rar1:#3B78B8; --rar2:#C9971A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background-color:var(--kraft);
  background-image:radial-gradient(rgba(46,34,25,.10) 1px,transparent 1.2px);
  background-size:7px 7px;
  color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:500;
  overflow:hidden;
}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}

#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:6px 18px;min-height:78px}
.side{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.side.right{justify-content:flex-end}
.side b{font-family:Bungee;font-size:32px;line-height:1;font-weight:400}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:block}
.center{display:flex;align-items:center;gap:14px}
#mid{text-align:right;font-family:Bungee;font-size:16px;line-height:1.15;min-width:190px}
#mid small{display:block;font-family:'Barlow Semi Condensed';font-weight:600;font-size:15px}
#mid .chrono{display:block;font-size:30px;line-height:1}
#mid .urgent{color:var(--trap)}
#mid .bar{display:block;height:8px;margin-top:3px;border:2px solid var(--ink);border-radius:3px;background:var(--paper);overflow:hidden}
#mid .bar i{display:block;height:100%;background:#3C9E4A}
#mid .urgent .bar i,#mid .bar.urgent i{background:var(--trap)}
#mini{display:block;border:3px solid var(--ink);border-radius:4px;background:#2E2219;max-width:36vw;height:auto;cursor:pointer}

#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#game{display:block;border:3px solid var(--ink);border-radius:6px;box-shadow:7px 7px 0 var(--ink);background:#4A3628;cursor:crosshair}

#dock{min-height:82px;padding:8px 18px 12px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 6px 4px;width:88px;background:var(--card);border:3px solid var(--ink);border-radius:4px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tool canvas{width:34px;height:34px}
.tool span{font-weight:700;font-size:13px;line-height:1.05;text-align:center}
.tool em{font-style:normal;font-size:13px}
.tool[aria-pressed="true"]{background:var(--trap);color:#fff;transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--ink)}
.budget{font-family:Bungee;font-size:15px;text-align:center;padding:0 8px;line-height:1.1}
.budget b{display:block;font-size:30px;font-weight:400}
.hint{font-size:14px;font-weight:600;max-width:150px;line-height:1.2}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-weight:600;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;border:2px solid var(--ink);display:block}

.btn{font-family:Bungee;font-size:17px;background:var(--trap);color:#fff;border:3px solid var(--ink);border-radius:4px;padding:10px 18px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(46,34,25,.5)}
#ov[hidden]{display:none}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:4px;box-shadow:9px 9px 0 var(--ink);padding:22px 26px;width:100%;max-width:860px;max-height:100%;overflow:auto}
.sheet.wide{max-width:1100px}
.sheet h2{font-family:Bungee;font-weight:400;font-size:26px;line-height:1.1;margin-bottom:4px}
.sheet p{font-size:17px;margin-bottom:12px;max-width:65ch}

.logo{display:flex;flex-wrap:wrap;gap:5px;font-family:Bungee;font-weight:400;font-size:clamp(30px,5.4vw,64px);line-height:1;margin:4px 0 12px}
.logo span{display:inline-block;padding:6px 9px 2px;background:var(--c);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(var(--r))}

.opts{display:grid;grid-template-columns:110px 1fr;gap:9px 14px;align-items:center;margin:8px 0 14px}
.opts label{font-weight:700;font-size:17px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--card);border:3px solid var(--ink);border-radius:4px;padding:4px 11px;font-weight:700;font-size:16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.slot{border:3px solid var(--ink);border-left-width:10px;border-left-color:var(--pc);background:var(--card);padding:6px 10px;border-radius:4px}
.slot b{display:flex;align-items:center;gap:8px;font-family:Bungee;font-weight:400;font-size:15px;margin-bottom:4px}
.slot b img,.who b img{height:34px;width:auto}
.who b{display:flex;align-items:center;gap:8px}
.slot .seg button{font-size:14px;padding:3px 9px}
.slot small{display:block;font-size:14px;font-weight:600;margin-top:4px;line-height:1.2}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{background:transparent;border:2px dashed var(--ink);border-radius:4px;padding:3px 10px;font-weight:700;font-size:14px;cursor:pointer}
.rules{font-size:16px;margin-bottom:16px;line-height:1.35}
.rules li{margin-left:18px}
.row-end{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.draft-row{display:grid;grid-template-columns:150px repeat(3,1fr);gap:10px;margin-top:12px}
.who{border-left:10px solid var(--pc);padding:4px 0 4px 10px;display:flex;flex-direction:column;justify-content:center}
.who b{font-family:Bungee;font-weight:400;font-size:18px}
.who span{font-size:14px;font-weight:600}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:3px solid var(--ink);border-top:9px solid var(--rc);border-radius:4px;padding:7px 10px 9px;cursor:pointer;min-height:92px}
.card small{font-weight:700;font-size:13px;color:var(--rc)}
.card strong{font-family:Bungee;font-weight:400;font-size:16px;line-height:1.1}
.card span{font-size:15px;line-height:1.2}
.card.sel{transform:translateY(-3px);box-shadow:5px 5px 0 var(--pc);outline:3px solid var(--pc);outline-offset:1px}
.card.chosen{box-shadow:5px 5px 0 var(--pc);outline:3px solid var(--pc)}
.card.off{opacity:.35}
.card:disabled{cursor:default}
.r0{--rc:var(--rar0)} .r1{--rc:var(--rar1)} .r2{--rc:var(--rar2)}

.res{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:17px}
.res td{padding:6px 8px;border-bottom:2px solid rgba(46,34,25,.2)}
.res td:first-child{border-left:10px solid var(--pc);font-weight:700}
.res td.t{font-family:Bungee;font-weight:400;text-align:right;white-space:nowrap}
.pts{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pts div{border:3px solid var(--ink);background:var(--card);padding:6px 14px;font-weight:700;font-size:17px;border-radius:4px}
.pts b{font-family:Bungee;font-weight:400;font-size:24px}
.augl{font-size:15px;margin:2px 0 6px}

@media (max-width:900px){
  #mini{display:none}
}
@media (max-width:760px){
  .draft-row{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ .tool[aria-pressed="true"],.card.sel{transform:none} }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="side"><div class="dots" id="rdots"></div>Coureurs <b id="sR">0</b></div>
    <div class="center">
      <div id="mid">Traquenard<small>Menu</small></div>
      <canvas id="mini" width="300" height="66" aria-label="Vue d’ensemble de la carte"></canvas>
    </div>
    <div class="side right">Piégeur <b id="sT">0</b><div class="dots"><i style="background:var(--trap)"></i></div></div>
  </header>
  <main id="stage">
    <canvas id="game" width="1280" height="704" aria-label="Terrain de jeu"></canvas>
    <div id="ov"></div>
  </main>
  <footer id="dock"></footer>
</div>

const cam={x:0,s:1,tx:0,ts:1};
const viewW=s=>VW/(s||cam.s);
const offY=()=>(VH-WH*cam.s)/2;
function camClampX(x,s){ const vw=VW/s; return vw>=WW?(WW-vw)/2:clamp(x,0,WW-vw); }
function updateCamera(dt){
  if(!G){ cam.s=cam.ts=1; cam.x=cam.tx=0; return; }
  const ph=G.phase; let k=4;
  if(ph==='place'||ph==='verify'){
    cam.ts=.72; k=10;
    if(!cfg.ai[3]&&ph==='place'){
      let p=0;
      if(keys.has('KeyA')||keys.has('ArrowLeft')) p-=1;
      if(keys.has('KeyD')||keys.has('ArrowRight')) p+=1;
      if(mouse.in&&mouse.cx<36) p-=1;
      if(mouse.in&&mouse.cx>VW-36) p+=1;
      cam.tx+=p*1200*dt;
    } else if(G.aiFocus!=null) cam.tx=G.aiFocus-viewW(cam.ts)/2;
  } else if(ph==='countdown'){ cam.ts=.85; cam.tx=0; }
  else if(ph==='run'){
    const act=G.runners.filter(r=>r.alive&&!r.finished);
    if(act.length){
      let a=Infinity,b=-Infinity;
      for(const r of act){ a=Math.min(a,r.x); b=Math.max(b,r.x+r.w); }
      cam.ts=clamp(VW/Math.max(b-a+12*T,26*T),.6,1);
      cam.tx=(a+b)/2-viewW(cam.ts)/2;
    }
  }
  cam.tx=camClampX(cam.tx,cam.ts);
  cam.s+=(cam.ts-cam.s)*Math.min(1,dt*2.5);
  cam.x+=(cam.tx-cam.x)*Math.min(1,dt*k);
  cam.x=camClampX(cam.x,cam.s);
}

let padsOk=true;
function pollInputs(){
  let pads=[];
  if(padsOk){ try{ pads=navigator.getGamepads?navigator.getGamepads()||[]:[]; }catch(e){ padsOk=false; pads=[]; } }
  const humans=[0,1,2].filter(i=>!cfg.ai[i]);
  for(let i=0;i<3;i++){
    const S=SCHEMES[i];
    let l=keys.has(S.left),r=keys.has(S.right),j=keys.has(S.jump),d=keys.has(S.down);
    const p=pads&&pads[humans.indexOf(i)];
    if(p&&humans.includes(i)){
      const b=k=>!!(p.buttons[k]&&p.buttons[k].pressed);
      const ax=p.axes[0]||0, ay=p.axes[1]||0;
      l=l||ax<-.4||b(14); r=r||ax>.4||b(15); j=j||b(0)||b(12); d=d||b(1)||b(2)||b(13)||ay>.6;
    }
    const I=INP[i];
    I.lP=(l&&!I.l)||pressed.has(S.left);
    I.rP=(r&&!I.r)||pressed.has(S.right);
    I.jP=(j&&!I.j)||pressed.has(S.jump);
    I.dP=(d&&!I.d)||pressed.has(S.down);
    I.l=l;I.r=r;I.j=j;I.d=d;
  }
  pressed.clear();
}

function onKey(e){
  if(!G) return;
  const btnFocus=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(G.phase==='place'&&!cfg.ai[3]){
    if(e.code==='KeyR') rotate(1);
    const m=/^Digit([0-9])$/.exec(e.code);
    if(m){ const n=+m[1]||10; const t=unlockedList()[n-1]; if(t){G.sel=t;renderDock();} }

}

function loadMap(key){
  const m=MAPS[key]; W=m.rows[0].length; WW=W*T; curMap=m;
  terrain=[]; gateGrid=[]; grid=[];
  const gates=[];
  for(let y=0;y<H;y++){ terrain.push(new Uint8Array(W)); gateGrid.push(new Array(W).fill(null)); grid.push(new Array(W).fill(null)); }
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(m.rows[y][x]==='#') terrain[y][x]=1;
  for(let x=0;x<W;x++) for(let y=0;y<H;y++){
    if(m.rows[y][x]!=='H'||gateGrid[y][x]) continue;
    let y1=y; while(y1+1<H&&m.rows[y1+1][x]==='H') y1++;
    const g={x,y0:y,y1,closed:0,k:0};
    gates.push(g); for(let k=y;k<=y1;k++) gateGrid[k][x]=g;
  }
  m.safeS=[0,0,m.safeL,H]; m.safeG=[W-m.safeR,0,m.safeR,H];
  curGates=gates;
  drawTerrainCache(); drawMiniBase(m,gates);
  return gates;
}

/* ---------- Augments ---------- */
function rollCards(pool,owned,boosted){
  const w=boosted?[48,37,15]:[68,26,6];
  const avail=pool.filter(a=>modeOk(a)&&(owned[a.id]||0)<a.max), out=[];
  while(out.length<3&&avail.length){
    let tot=avail.reduce((s,a)=>s+w[a.r],0), x=Math.random()*tot, k=0;
    for(;k<avail.length;k++){ x-=w[avail[k].r]; if(x<=0) break; }
    k=Math.min(k,avail.length-1); out.push(avail[k]); avail.splice(k,1);
  }
  return out;
}
function startDraft(){
  G.phase='draft';
  const bR=G.round>1&&G.teamScore<G.trapper.score, bT=G.round>1&&G.trapper.score<G.teamScore;
  const aiT=()=>.7+Math.random()*1.1;
  G.draft={
    r:G.runners.map(r=>({cards:rollCards(RAUG,r.aug,bR),sel:0,done:false,chosen:-1,ai:!!r.ai,aiT:aiT()})),
    t:{cards:rollCards(TAUG,G.trapper.aug,bT),sel:0,done:false,chosen:-1,ai:cfg.ai[3],aiT:aiT()},
    boostR:bR,boostT:bT,closing:false
  };
  G.draft.r.forEach(x=>{ if(!x.cards.length) x.done=true; });
  if(!G.draft.t.cards.length) G.draft.t.done=true;
  renderDraft(); renderHud(); renderDock();
  checkDraftEnd();
}
function aiChoice(cards){
  let best=0; cards.forEach((a,i)=>{ if(a.r>cards[best].r||(a.r===cards[best].r&&a.unlock&&!cards[best].unlock)) best=i; });
  return best;
}
function pickCard(who,i){
  if(!G||G.phase!=='draft') return;
  const d=who==='t'?G.draft.t:G.draft.r[+who];
  if(!d||d.done||!d.cards[i]) return;
  const a=d.cards[i]; d.done=true; d.chosen=i; d.sel=i;
  const owner=who==='t'?G.trapper:G.runners[+who];
  owner.aug[a.id]=(owner.aug[a.id]||0)+1;
  if(a.unlock) G.trapper.unlocked.add(a.unlock);
  renderDraft();
  checkDraftEnd();
}
function checkDraftEnd(){
  if(!G.draft.closing&&G.draft.t.done&&G.draft.r.every(x=>x.done)){
    G.draft.closing=true; setTimeout(()=>{ if(G&&G.phase==='draft') startPlacement(); },550);
  }
}
function updateDraft(dt){
  G.draft.r.forEach((d,i)=>{
    if(d.done) return;
    if(d.ai){ d.aiT-=dt; if(d.aiT<=0) pickCard(String(i),aiChoice(d.cards)); return; }
    const I=INP[i], n=d.cards.length; let ch=false;
    if(I.lP){ d.sel=(d.sel+n-1)%n; ch=true; }
    if(I.rP){ d.sel=(d.sel+1)%n; ch=true; }
    if(I.jP){ pickCard(String(i),d.sel); return; }
    if(ch) renderDraft();
  });
  const t=G.draft.t;
  if(t.ai&&!t.done){ t.aiT-=dt; if(t.aiT<=0) pickCard('t',aiChoice(t.cards)); }
}

function costOf(type){ const c=TRAPS[type].cost; if(c===1&&G.trapper.freeLeft>0) return 0; return c; }
function canPlace(tx,ty,type){
  if(tx<0||ty<0||tx>=W||ty>=H) return 'Hors carte';
  if(terrain[ty][tx]) return 'Roche';
  if(gateGrid[ty][tx]) return 'Herse';
  if(grid[ty][tx]) return 'Occupé';
  if(inRect(tx,ty,G.map.safeS)||inRect(tx,ty,G.map.safeG)) return 'Zone protégée';
  if(costOf(type)>G.trapper.points) return 'Budget insuffisant';
  return '';
}
function placeDir(type,dir){
  if(!TRAPS[type].rot) return 0;
  if(type==='tapis') return (dir===1||dir===2)?1:3;
  return dir;
}
function placeTrap(tx,ty,type,dir){
  const c=costOf(type), free=c===0&&TRAPS[type].cost>0;
  if(free) G.trapper.freeLeft--;
  G.trapper.points-=c;
  const t={type,tx,ty,dir:placeDir(type,dir),round:G.round,paid:c,free};
  G.traps.push(t); grid[ty][tx]=t;
  prepareTraps();
  burst((tx+.5)*T,(ty+.5)*T,'#F1E4C8',8,120);
  G.blocked=false;
  renderDock();
}
function removeTrap(t){
  G.traps.splice(G.traps.indexOf(t),1); grid[t.ty][t.tx]=null;
  G.trapper.points+=t.paid; if(t.free) G.trapper.freeLeft++;
  prepareTraps();
  burst((t.tx+.5)*T,(t.ty+.5)*T,'#8A7F70',8,100);
}
function tryPlace(p){
  const tx=Math.floor(p.x/T), ty=Math.floor(p.y/T), type=G.sel;
  if(canPlace(tx,ty,type)){ G.flash={tx,ty,t:.25}; return; }
  placeTrap(tx,ty,type,G.dir);
}
function tryRemove(p){
  const tx=Math.floor(p.x/T), ty=Math.floor(p.y/T);
  if(tx<0||ty<0||tx>=W||ty>=H) return;
  const t=grid[ty][tx]; if(!t||t.round!==G.round) return;
  removeTrap(t); G.blocked=false;
  renderDock();
}
function rotate(s){ G.dir=(G.dir+s+4)%4; renderDock(); }

/* Vérification : un coureur sans amélioration doit pouvoir atteindre le drapeau. */
function newBaseGraph(){
  G.goalZ=goalZone();
  const st=runnerStats({}), g={done:false,nodes:new Map(),dist:new Map(),vr:makeVirtual(st),hz:new Float32Array(W*H)};
  const v=makeVirtual(st); v.x=G.map.spawn[0]*T; v.y=G.map.spawn[1]*T-v.h;
  g.start=standCell(v);
  g.it=buildGraph(g,[g.start]);
  return g;
}
function pumpGraph(g,ms){
  const t0=performance.now();
  while(!g.done&&performance.now()-t0<ms){
    SIM=true; let s;
    try{ s=g.it.next(); } finally{ SIM=false; }
    if(s.done) g.done=true;
  }
  return g.done;
}
const graphOk=g=>g.dist.has(g.start[0]+g.start[1]*W);
function beginVerify(auto){
  G.phase='verify'; G.verify={g:newBaseGraph(),auto};
  renderHud(); renderDock();
}
function updateVerify(){
  const V=G.verify;
  if(!pumpGraph(V.g,18)) return;
  if(graphOk(V.g)){ startRun(); return; }
  if(V.auto){
    const mine=G.traps.filter(t=>t.round===G.round), list=mine.length?mine:G.traps;
    if(!list.length){ startRun(); return; }
    removeTrap(list[list.length-1]);
    G.toast={text:'Passage bloqué : dernier piège retiré',t:2.2};
    G.verify={g:newBaseGraph(),auto:true};
    return;
  }
  G.phase='place'; G.blocked=true;
  G.toast={text:'Parcours bloqué : libère un passage',t:2.6};
  renderHud(); renderDock();
}

/* IA du piégeur : pose autour du chemin le plus court */
const AI_W={pics:5,bloc:3,fragile:3,glu:3,ressort:2,tapis:2,canon:3,vent:2,mine:3,scie:3,gant:3,flamme:3,glace:3};
function pathCells(g){
  const cells=new Set();
  let n=g.nodes.get(g.start[0]+g.start[1]*W);
  for(let i=0;i<120&&n;i++){
    let best=null,bv=Infinity;
    for(const e of n.edges){ const d=e.to===GOALK?0:g.dist.get(e.to); if(d===undefined) continue; const v=d+e.c+e.pen; if(v<bv){bv=v;best=e;} }
    if(!best) break;
    const steps=Math.max(Math.abs(best.tx-n.tx),Math.abs(best.ty-n.ty),1);
    for(let k=0;k<=steps;k++){ const x=Math.round(n.tx+(best.tx-n.tx)*k/steps), y=Math.round(n.ty+(best.ty-n.ty)*k/steps)-(k>0&&k<steps?1:0); cells.add(x+','+y); }
    if(best.to===GOALK) break;
    n=g.nodes.get(best.to);
  }
  return cells;
}
function aiPlaceOne(path){
  const tp=G.trapper;
  const types=unlockedList().filter(t=>costOf(t)<=tp.points);
  if(!types.length) return false;

  const cands=[]; let sum=0;
  for(let ty=0;ty<H-1;ty++) for(let tx=0;tx<W;tx++){
    if(canPlace(tx,ty,type)) continue;
    const ground=solidAt(tx,ty+1,null)&&!grid[ty+1][tx];
    const above=!ground&&ty+2<H&&solidAt(tx,ty+2,null)&&!solidAt(tx,ty+1,null);
    let w=0;
    if(['pics','mine','glu','bloc','fragile','ressort','tapis'].includes(type)) w=ground?3:(above&&(type==='bloc'||type==='glu')?1:0);
    else if(['canon','flamme','glace','vent'].includes(type)) w=(ground||above)?2:0;
    else w=above?3:(ground?1:0);
    if(path){ let near=false; for(let a=-1;a<=1&&!near;a++) for(let b=-1;b<=1&&!near;b++) if(path.has((tx+a)+','+(ty+b))) near=true; if(near) w*=4; }
    if(w>0){ cands.push([tx,ty,w]); sum+=w; }

  if(!cands.length) return false;
  let y=Math.random()*sum, c=cands[0];
  for(const k of cands){ y-=k[2]; if(y<=0){ c=k; break; } }
  let dir=0;
  if(['canon','flamme','glace','vent','tapis'].includes(type)) dir=Math.random()<.75?3:pick([0,1,2]);
  else if(type==='scie'||type==='gant') dir=pick([1,3]);
  placeTrap(c[0],c[1],type,dir);
  G.aiFocus=c[0]*T;

}
function updateAiPlacement(dt){

/* ---------- Pièges : préparation ---------- */
function rayLen(t,max){
  const [dx,dy]=DIRS[t.dir]; let n=0;
  for(let k=1;k<=max;k++){ const x=t.tx+dx*k,y=t.ty+dy*k; if(x<0||x>=W||y<0||y>=H||solidAt(x,y,null)) break; n++; }
  return n;
}
function rayRect(t,len,ins){
  const [dx,dy]=DIRS[t.dir];
  if(dx) return {x:dx>0?(t.tx+1)*T:(t.tx-len)*T, y:t.ty*T+ins, w:len*T, h:T-2*ins};
  return {x:t.tx*T+ins, y:dy>0?(t.ty+1)*T:(t.ty-len)*T, w:T-2*ins, h:len*T};
}
function prepareTraps(){
  for(const t of G.traps){

    if(t.type==='vent'){ t.len=rayLen(t,6); t.rect=rayRect(t,t.len,0); }

}

/* ---------- Course ---------- */
function runTime(){
  const [l,n]=G.map.lim, c=G.trapper.aug.chrono||0;

}
function pilonCdMax(){ return Math.max(2.5,(G.lethal?7:5)-1*(G.trapper.aug.forge||0)); }
function gateCdMax(){ return Math.max(2.5,6-1.2*(G.trapper.aug.herse2||0)); }
function gateDur(){ return 2.5+(G.trapper.aug.herse||0); }
function startRun(){

}
function stepRunner(r,h,I){
  const st=r.st;

  r.dashCd=Math.max(0,r.dashCd-h); r.wallLock=Math.max(0,r.wallLock-h); r.stun=Math.max(0,r.stun-h);
  if(r.hold>0) r.hold-=h;
  if(I.jP){ r.jumpBuf=.13; I.jP=false; } else r.jumpBuf=Math.max(0,r.jumpBuf-h);
  const busy=r.hold>0||r.stun>0;

      const target=move*st.speed*(glue?.35:1);
      const acc=r.onGround?(glue?2200:2800*ice):1800;
      if(r.wallLock<=0) r.vx+=clamp(target-r.vx,-acc*h,acc*h);
    }
    r.vy+=st.grav*h;
    if(r.cut&&!I.j&&r.vy<0) r.vy+=st.grav*h*1.3;
    if(r.vy>=0) r.cut=false;
    if(!busy&&r.wallDir&&!r.onGround&&r.vy>0&&move===r.wallDir) r.vy=Math.min(r.vy,150*(1-.28*st.grip));
    r.vy=Math.min(r.vy,950);
  }
  if(!busy&&r.jumpBuf>0){
    if(r.onGround||r.coyote>0){ r.vy=-st.jump*(glue?.55:1); r.cut=true; r.jumpBuf=0; r.coyote=0; r.onGround=false; burst(r.x+r.w/2,r.y+r.h,glue?'#86B83C':'#E3D2AE',5,80); }
    else if(r.wallDir){ r.vy=-st.jump*.95; r.cut=true; r.vx=-r.wallDir*(300+50*st.grip); r.facing=-r.wallDir; r.wallLock=.14; r.jumpBuf=0; }
    else if(r.air>0){ r.air--; r.vy=-st.jump*.88; r.cut=true; r.jumpBuf=0; burst(r.x+r.w/2,r.y+r.h,'#FFFFFF',6,90); }
  }
  let wx=0;
  for(const t of G.vents){
    if(!t.len||!overlap(r,t.rect)) continue;
    const d=DIRS[t.dir];
    if(d[0]) wx+=d[0]*270;
    else if(d[1]<0){ r.vy=Math.max(r.vy-2900*h,-520); r.cut=false; }
    else r.vy+=1600*h;
  }
  if(r.onGround&&U.belt) wx+=U.belt*190;
  const vxT=r.vx+wx;

  }

  if(r.onGround){ r.coyote=.1; r.air=st.air; if(U.pure&&!SIM) r.safe={x:r.x,y:r.y}; if(glue&&!SIM&&Math.abs(r.vx)>40&&Math.random()<.05) burst(r.x+r.w/2,r.y+r.h,'#86B83C',2,40); }

}
function collideX(r,v){
  const y0=Math.floor(r.y/T), y1=Math.floor((r.y+r.h-.01)/T);
  if(v>0){ const tx=Math.floor((r.x+r.w-.01)/T); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty,r)){ r.x=tx*T-r.w; r.vx=Math.min(r.vx,0); r.dashT=0; return; } }
  else if(v<0){ const tx=Math.floor(r.x/T); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty,r)){ r.x=(tx+1)*T; r.vx=Math.max(r.vx,0); r.dashT=0; return; } }
}
function collideY(r){
  const x0=Math.floor(r.x/T), x1=Math.floor((r.x+r.w-.01)/T);
  if(r.vy>0){ const ty=Math.floor((r.y+r.h-.01)/T); for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty,r)){ r.y=ty*T-r.h; r.vy=0; return true; } }
  else if(r.vy<0){ const ty=Math.floor(r.y/T); for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty,r)){ r.y=(ty+1)*T; r.vy=0; return false; } }
  return false;
}
/* Détecte le sol sous les pieds et ce qu'il contient (glu, ressort, tapis...). Appelée à chaque pas. */
function groundBelow(r){
  const U=r.under; U.glu=false; U.spring=null; U.belt=0; U.pure=true; U.frag=false;
  if(r.vy<0) return false;
  const ty=Math.floor((r.y+r.h+1)/T); if(ty>=H) return false;
  const x0=Math.floor(r.x/T), x1=Math.floor((r.x+r.w-.01)/T);
  let g=false;
  for(let tx=x0;tx<=x1;tx++){
    if(!solidAt(tx,ty,r)) continue;
    g=true;
    const t=(ty>=0&&tx>=0&&tx<W)?grid[ty][tx]:null;
    if(!t) continue;
    U.pure=false;
    if(t.type==='glu') U.glu=true;
    else if(t.type==='ressort') U.spring=t;
    else if(t.type==='tapis') U.belt=DIRS[t.dir][0];
    else if(t.type==='fragile'){ U.frag=true; if(!SIM&&!(t.crumble>0)&&!(t.broken>0)) t.crumble=.45; }

}
function wallCheck(r){
  const y0=Math.floor((r.y+4)/T), y1=Math.floor((r.y+r.h-4)/T);
  const L=Math.floor((r.x-1)/T), R=Math.floor((r.x+r.w+1)/T);
  for(let ty=y0;ty<=y1;ty++){ if(solidAt(R,ty,r)) return 1; if(solidAt(L,ty,r)) return -1; }
  return 0;
}
function sawPos(t){
  const [dx,dy]=DIRS[t.dir], k=.5-.5*Math.cos(t.t*1.7);
  return {x:(t.tx+.5)*T+dx*3*T*k, y:(t.ty+.5)*T+dy*3*T*k};
}
/* Pics : 1,5 s sortis (létaux) puis 1,5 s rentrés (sans danger) */
function picsOut(t){ return !t||!(t.t>0)||(t.t%3)<1.5; }
function flameState(t){ const p=(t.t+t.phase)%3; return p<1.3?0:p<1.8?1:2; }
function circRect(cx,cy,rad,r){
  const nx=clamp(cx,r.x,r.x+r.w), ny=clamp(cy,r.y,r.y+r.h);
  return (cx-nx)**2+(cy-ny)**2<rad*rad;
}
function nearestRunner(x,y,max){
  let best=null,bd=max*max;
  for(const r of G.runners){ if(!r.alive||r.finished) continue; const d=(r.x+r.w/2-x)**2+(r.y+r.h/2-y)**2; if(d<bd){bd=d;best=r;} }

/* Effets des pièges */
function bump(r,nx,ny,force){

  r.knockImm=.45;
  if(r.shield>0){ r.shield--; r.blink=.5; burst(r.x+r.w/2,r.y+r.h/2,'#5BC0EB',16,200); return; }
  const k=force*(1+.2*(G.trapper.aug.puissance||0))*(1-.3*r.st.lest);
  r.vx=nx*k; r.vy=Math.min(r.vy,ny*k-180); r.cut=false; r.stun=.35*(1-.3*r.st.lest); r.dashT=0; r.hits++;
  G.shake=Math.max(G.shake,4); burst(r.x+r.w/2,r.y+r.h/2,'#F1E4C8',10,180);
  if(r.ai) r.ai.exec=null;
}
function hold(r,dur,kind){

  if(kind==='glace'&&r.st.antigel) return;
  if(r.shield>0){ r.shield--; r.knockImm=.6; r.blink=.5; burst(r.x+r.w/2,r.y+r.h/2,'#5BC0EB',16,200); return; }
  const d=(dur+.4*(G.trapper.aug.gel||0))*(1-.3*r.st.lest);
  r.hold=d; r.holdKind=kind; r.knockImm=d+.5; r.vx=0; r.dashT=0; r.hits++;
  burst(r.x+r.w/2,r.y+r.h/2,kind==='glace'?'#BDE6F2':'#F2C14E',12,140);

}
function fallBack(r){

  const s=r.st.balise&&r.safe?r.safe:null;
  placeAtSpawn(r);
  if(s){ r.x=s.x; r.y=s.y; }
  r.knockImm=1; r.blink=1;
  if(r.ai){ r.ai.exec=null; r.ai.cur=null; }
}
function hurt(r,cause){
  if(!r.alive||r.finished) return;
  const fall=cause==='Chute';
  if(!fall&&r.invuln>0) return;
  const cx=r.x+r.w/2, cy=r.y+r.h/2;
  if(!fall&&r.shield>0){ r.shield--; r.invuln=1.2; r.blink=1.2; r.vy=-420; burst(cx,cy,'#5BC0EB',16,200); return; }
  burst(cx,clamp(cy,0,WH-4),r.color,26,280); G.shake=8;
  if(r.second>0){ r.second--; placeAtSpawn(r); r.invuln=1.5; r.blink=1.5; if(r.ai){ r.ai.exec=null; r.ai.cur=null; } G.toast={text:r.name+' : seconde chance',t:1.6}; return; }
  r.alive=false; r.cause=cause;
}
function updateTraps(h){
  const tp=G.trapper.aug;
  for(const t of G.traps){
    t.t+=h;
    if(t.squish>0) t.squish-=h;
    if(t.type==='fragile'){
      if(t.crumble>0){ t.crumble-=h; if(t.crumble<=0){ t.crumble=0; t.broken=3; burst((t.tx+.5)*T,(t.ty+.5)*T,'#DDB97F',14,160); } }
      else if(t.broken>0){
        t.broken-=h;
        if(t.broken<=0){ const R={x:t.tx*T,y:t.ty*T,w:T,h:T}; t.broken=G.runners.some(r=>r.alive&&!r.finished&&overlap(r,R))?.1:0; }
      }
    }
    if(t.type==='canon'){
      const cx=(t.tx+.5)*T, cy=(t.ty+.5)*T;
      if(tp.traqueur){ const r=nearestRunner(cx,cy,15*T); if(r){ const ax=r.x+r.w/2-cx, ay=r.y+r.h/2-cy, L=Math.hypot(ax,ay)||1; t.aim=[ax/L,ay/L]; } }

        G.bullets.push({x:cx+dx*26,y:cy+dy*26,vx:dx*sp,vy:dy*sp,life:6});
      }
    }
    if(t.type==='mine'&&t.fuse>=0){
      t.fuse-=h;
      if(t.fuse<0){
        t.used=true; t.fuse=-1;
        const cx=(t.tx+.5)*T, cy=(t.ty+.5)*T;
        burst(cx,cy,'#F2C14E',30,320); burst(cx,cy,G.lethal?'#C2362F':'#FFFFFF',16,220); G.shake=10;
        for(const r of G.runners){
          if(!r.alive||r.finished) continue;
          if(G.lethal){ if(circRect(cx,cy,64,r)) hurt(r,'Mine'); }
          else if(circRect(cx,cy,74,r)){ const dx=r.x+r.w/2-cx, dy=r.y+r.h/2-cy, L=Math.hypot(dx,dy)||1; bump(r,dx/L,Math.min(dy/L,-.5),640); }
        }

function updateBullets(h){
  for(const b of G.bullets){

    if(b.x<0||b.x>WW||b.y<-40||b.y>WH||solidAt(Math.floor(b.x/T),Math.floor(b.y/T),null)){ b.life=0; burst(b.x,b.y,G.lethal?'#5A4A3C':'#E58FA6',4,60); continue; }

/* ---------- Outils du piégeur en course ----------
   Pilon : tombe du plafond du couloir visé, après un court préavis.
   Herse : ferme un couloir quelques secondes (emplacements fixes sur la carte). */
function dropPilon(px,py){
  if(G.pilonCd>0) return false;
  const tx=Math.floor(px/T), ty=Math.floor(py/T);
  if(tx<0||tx>=W||ty<1||ty>=H||solidAt(tx,ty,null)) return false;
  let cy=ty; while(cy>0&&!solidAt(tx,cy-1,null)) cy--;
  const top=cy*T, w=(G.trapper.aug.pilon2?2:1)*46, x=clamp(px-w/2,0,WW-w);
  const x0=Math.floor(x/T), x1=Math.floor((x+w-.01)/T);

  for(let y=ty;y<H&&land>WH;y++) for(let c=x0;c<=x1;c++) if(solidAt(c,y,null)){ land=y*T; break; }
  G.pilons.push({x,w,h:22,top,y:top-22,vy:0,land,state:0,t:G.lethal?.8:.65,t0:G.lethal?.8:.65});
  G.pilonCd=pilonCdMax();
  return true;
}
function updatePilons(h){

    if(p.state===0){ p.t-=h; if(p.t<=0){ p.state=1; p.vy=200; } }
    else if(p.state===1){
      p.vy+=3200*h; p.y+=p.vy*h;
      for(const r of G.runners){
        if(!r.alive||r.finished||r.st.casque||!overlap(r,p)) continue;
        if(G.lethal) hurt(r,'Pilon'); else hold(r,1.2,'sonne');
      }
      if(p.y+p.h>=p.land){ p.y=p.land-p.h; p.state=2; p.t=.45; G.shake=Math.max(G.shake,G.lethal?8:4); burst(p.x+p.w/2,p.land,'#E3D2AE',12,180); }
    }
    else if(p.state===2){ p.t-=h; if(p.t<=0) p.state=3; }
    else { p.y-=520*h; if(p.y<=p.top-p.h) p.state=4; }
  }
  G.pilons=G.pilons.filter(p=>p.state<4&&p.y<WH+60);
}
function gateNear(x,y){
  let best=null,bd=3*T;
  for(const g of G.gates){
    const gx=(g.x+.5)*T;
    if(y<g.y0*T-1.5*T||y>(g.y1+1)*T+1.5*T) continue;
    const d=Math.abs(gx-x); if(d<bd){ bd=d; best=g; }

}
function closeGate(g){

}
function gateRect(g){ return {x:g.x*T,y:g.y0*T,w:T,h:(g.y1-g.y0+1)*T}; }
function updateGates(h){
  for(const g of G.gates){
    if(g.closed>0){

}
function gateSlam(g){

    const dir=r.x+r.w/2<cx?-1:1;
    if(G.lethal) hurt(r,'Herse');
    if(!r.alive) continue;
    r.x=dir<0?R.x-r.w-1:R.x+R.w+1;
    if(r.knockImm<=0) bump(r,dir,-.3,360);
  }
}
/* IA du piégeur en course */
function aiTrapperRun(dt){
  const act=G.runners.filter(r=>r.alive&&!r.finished);
  if(!act.length) return;
  G.aiPilonT-=dt;
  if(G.pilonCd<=0&&G.aiPilonT<=0){
    const tg=act.reduce((a,b)=>b.x>a.x?b:a);
    dropPilon(tg.x+tg.w/2+tg.vx*.75+(Math.random()-.5)*1.6*T,tg.y+tg.h/2);
    G.aiPilonT=.4+Math.random()*1.4;
  }
  G.aiGateT-=dt;
  if(G.gateCd<=0&&G.aiGateT<=0){
    for(const g of G.gates){
      if(g.closed>0||g.k>0) continue;
      const gx=g.x*T;
      if(act.some(r=>{ const d=gx-(r.x+r.w); return d>0&&d<4*T&&r.vx>40&&r.y+r.h>g.y0*T&&r.y<(g.y1+1)*T; })){
        closeGate(g); G.aiGateT=.5+Math.random(); break;
      }
    }
  }
}

function checkHazards(r){
  const st=r.st;
  if(G.lethal&&!st.blinde){
    const x0=Math.floor(r.x/T)-1, x1=Math.floor((r.x+r.w)/T)+1, y0=Math.floor(r.y/T)-1, y1=Math.floor((r.y+r.h)/T)+1;
    for(let ty=Math.max(0,y0);ty<=Math.min(H-1,y1);ty++) for(let tx=Math.max(0,x0);tx<=Math.min(W-1,x1);tx++){
      const t=grid[ty][tx];
      if(t&&t.type==='pics'&&picsOut(t)&&overlap(r,{x:tx*T+5,y:ty*T+5,w:T-10,h:T-10})) hurt(r,'Pics');
    }
  }
  for(const t of G.traps){
    if(!r.alive||r.finished) return;
    if(t.type==='scie'){ const p=sawPos(t); if(circRect(p.x,p.y,13,r)) hurt(r,'Scie'); }
    else if(t.type==='gant'){ const p=sawPos(t); if(circRect(p.x,p.y,15,r)){ const dx=r.x+r.w/2-p.x, dy=r.y+r.h/2-p.y, L=Math.hypot(dx,dy)||1; bump(r,dx/L,Math.min(dy/L,-.4),540); } }
    else if(t.type==='flamme'&&t.len&&!st.ignifuge&&flameState(t)===2&&overlap(r,t.rect)) hurt(r,'Flammes');
    else if(t.type==='glace'&&t.len&&flameState(t)===2&&overlap(r,t.rect)) hold(r,1.1,'glace');
    else if(t.type==='mine'&&!t.used&&t.fuse<0&&!st.leger){
      if(Math.hypot(r.x+r.w/2-(t.tx+.5)*T,r.y+r.h/2-(t.ty+.5)*T)<34) t.fuse=.42;
    }
  }
  if(r.alive&&!r.finished&&overlap(r,G.goalZ)){
    r.finished=true; r.rank=++G.finCount; r.finishes++; r.time=G.runT;
    const k=recKey();
    if(!(REC[k]<=r.time)){ REC[k]=r.time; r.record=true; saveRec(); }
    G.toast={text:r.name+' : '+fmt(r.time)+' s'+(r.record?', record':''),t:2};
    const c=r.x+r.w/2;
    for(const col of COLORS) burst(c,r.y,col,10,260);
  }
}
function stepRun(dt){
  const n=Math.ceil(dt/(1/120)), h=dt/n;
  for(let s=0;s<n;s++){
    updateGates(h);
    for(const r of G.runners){
      if(!r.alive||r.finished) continue;
      const I=r.ai?botStep(r,h):INP[r.id];
      stepRunner(r,h,I);
      if(r.y>WH+50){ if(G.lethal) hurt(r,'Chute'); else fallBack(r); }
    }
    updateTraps(h); updateBullets(h); updatePilons(h);
    for(const r of G.runners) if(r.alive&&!r.finished) checkHazards(r);
  }
  G.runT+=dt;
  G.pilonCd=Math.max(0,G.pilonCd-dt);
  G.gateCd=Math.max(0,G.gateCd-dt);
  if(cfg.ai[3]) aiTrapperRun(dt);
  G.timer-=dt;
  const active=G.runners.filter(r=>r.alive&&!r.finished);
  if(G.timer<=0){ active.forEach(r=>{ r.alive=false; r.cause='Temps écoulé'; }); endRun(); return; }
  if(!active.length){ G.endDelay-=dt; if(G.endDelay<=0) endRun(); }
}
function endRun(){
  G.phase='result';
  const fin=G.runners.filter(r=>r.finished).length, out=G.runners.length-fin;
  const tPts=out+(out>0&&G.trapper.aug.prime?1:0);
  let note='';
  if(fin===0) note='Personne n’est arrivé : tous les points vont au piégeur.';
  else if(out===0) note='Tout le monde est arrivé : le piégeur ne marque rien.';
  G.teamScore+=fin; G.trapper.score+=tPts;
  G.last={fin,tPts,note};
  renderResult(); renderHud(); renderDock();
}
function afterResult(){
  if(!G||G.phase!=='result') return;
  if(G.round>=cfg.rounds){ G.phase='over'; renderOver(); renderHud(); renderDock(); }
  else { hideOverlay(); nextRound(); }
}

/* ---------- IA des coureurs ----------
   Au départ de chaque course, on simule depuis chaque case où l'on peut se tenir
   une série de gestes (marcher, sauter plus ou moins haut, infléchir en l'air).
   On obtient un graphe de déplacements possibles, puis le chemin le plus rapide
   jusqu'au drapeau. Les zones dangereuses coûtent plus cher. */
const PROGS=(()=>{
  const a=[];
  for(const d of [-1,1]){
    for(const jd of [0,.07,.16,.3,.6]) a.push({d1:d,t1:9,d2:d,jd});
    for(const t1 of [.14,.28]) for(const d2 of [0,-d]) for(const jd of [.16,.3,.6]) a.push({d1:d,t1,d2,jd});
  }
  for(const t1 of [.12,.3]) for(const d2 of [-1,1]) for(const jd of [.3,.6]) a.push({d1:0,t1,d2,jd});
  a.push({d1:0,t1:9,d2:0,jd:.6});
  return a;
})();
const PROGS_AIR=PROGS.concat((()=>{
  const a=[];
  for(const d of [-1,1]) for(const j2 of [.3,.45]) a.push({d1:d,t1:9,d2:d,jd:.3,j2});
  for(const d of [-1,1]) for(const j2 of [.35,.5]) a.push({d1:0,t1:.25,d2:d,jd:.35,j2});
  return a;
})());
const SIMI={l:false,r:false,j:false,d:false,jP:false,dP:false};
function standCell(r){
  const ty=Math.floor((r.y+r.h-1)/T);
  let tx=Math.floor((r.x+r.w/2)/T);
  if(!solidAt(tx,ty+1,r)){
    const a=Math.floor(r.x/T), b=Math.floor((r.x+r.w-.01)/T);
    tx=solidAt(a,ty+1,r)?a:(solidAt(b,ty+1,r)?b:tx);
  }
  return [tx,ty];
}
function graphSig(st){ return [st.speed,st.jump,st.grav,st.air,st.size,st.antiglu,st.leger,st.blinde,st.ignifuge,st.antigel].join('|'); }
function buildHazard(st){
  const hz=new Float32Array(W*H);
  const add=(tx,ty,p)=>{ if(tx>=0&&tx<W&&ty>=0&&ty<H) hz[ty*W+tx]=Math.max(hz[ty*W+tx],p); };
  for(const t of G.traps){
    const [dx,dy]=DIRS[t.dir];
    if(t.type==='pics'&&G.lethal&&!st.blinde) add(t.tx,t.ty,2.5);
    else if(t.type==='fragile') add(t.tx,t.ty-1,1.5);
    else if(t.type==='scie'||t.type==='gant'){ for(let k=0;k<=3;k++) add(t.tx+dx*k,t.ty+dy*k,t.type==='scie'?3:1.2); }
    else if((t.type==='flamme'&&!st.ignifuge)||(t.type==='glace'&&!st.antigel)){ for(let k=1;k<=t.len;k++) add(t.tx+dx*k,t.ty+dy*k,t.type==='flamme'?2.5:1.2); }
    else if(t.type==='mine'&&!st.leger){ for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++) add(t.tx+a,t.ty+b,G.lethal?4:1.2); }
  }
  return hz;
}
function hzAt(hz,r){
  const x0=Math.max(0,Math.floor((r.x-2)/T)), x1=Math.min(W-1,Math.floor((r.x+r.w+2)/T));
  const y0=Math.max(0,Math.floor((r.y-2)/T)), y1=Math.min(H-1,Math.floor((r.y+r.h+1)/T));
  let p=0;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const v=hz[y*W+x]; if(v>p) p=v; }
  return p;
}
function makeVirtual(st){
  return {id:-1,st,w:20*st.size,h:26*st.size,under:freshUnder(),x:0,y:0,vx:0,vy:0,facing:1,color:'#000',
    onGround:true,coyote:0,jumpBuf:0,wallDir:0,wallLock:0,dashT:0,dashCd:0,stun:0,hold:0,knockImm:0,invuln:0,blink:0,cut:false,air:0};
}
function simulate(g,n,P){
  const vr=g.vr, st=vr.st, h=1/120;
  vr.x=n.tx*T+T/2-vr.w/2; vr.y=(n.ty+1)*T-vr.h; vr.vx=0; vr.vy=0;
  vr.onGround=true; vr.coyote=.1; vr.jumpBuf=0; vr.wallDir=0; vr.wallLock=0; vr.air=st.air;
  vr.dashT=0; vr.stun=0; vr.hold=0; vr.cut=false; vr.knockImm=0;
  groundBelow(vr);
  const I=SIMI, j2k=P.j2?Math.round(P.j2/h):-1;
  let air=false, pen=0;
  for(let k=0;k<216;k++){
    const t=k*h, d=t<P.t1?P.d1:P.d2;
    I.l=d<0; I.r=d>0; I.j=t<P.jd||(j2k>=0&&k>=j2k&&k<j2k+36);
    I.jP=(k===0&&P.jd>0)||k===j2k; I.dP=false;
    stepRunner(vr,h,I);
    if(vr.y>WH) return null;
    const p=hzAt(g.hz,vr); if(p>pen) pen=p;
    if(overlap(vr,G.goalZ)) return {to:GOALK,c:t+h,pen,tx:G.map.goal[0],ty:G.map.goal[1]-1,walk:false};
    if(!vr.onGround){ air=true; continue; }
    if(k<2) continue;
    if(!air&&k>24&&Math.abs(vr.vx)<1) return null;
    const [tx,ty]=standCell(vr), key=tx+ty*W;
    if(air||key!==n.k){ if(key===n.k) return null; return {to:key,c:t+h,pen,tx,ty,walk:!air&&P.jd===0}; }
  }
  return null;
}
function expandNode(g,k,queue){
  const n=g.nodes.get(k); n.expanded=true;
  const best=new Map(), progs=g.vr.st.air?PROGS_AIR:PROGS;
  for(const P of progs){
    const res=simulate(g,n,P); if(!res) continue;
    const cur=best.get(res.to);
    if(!cur||res.c+res.pen<cur.c+cur.pen) best.set(res.to,{to:res.to,c:res.c,pen:res.pen,P,tx:res.tx,ty:res.ty,walk:res.walk});
  }
  n.edges=[...best.values()];
  for(const e of n.edges){
    if(e.to===GOALK||g.nodes.has(e.to)) continue;
    g.nodes.set(e.to,{k:e.to,tx:e.tx,ty:e.ty,edges:[],expanded:false});
    if(queue) queue.push(e.to);
  }
}
/* Bruit propre à chaque IA sur le coût des arcs : les coureurs ne prennent pas tous le même couloir. */
function edgeNoise(seed,from,to){ return ((((from*73856093)^(to*19349663)^seed)>>>0)%1000)/1000*.45; }
function computeDist(g,seed){
  const rev=new Map();
  for(const n of g.nodes.values()) for(const e of n.edges){ let a=rev.get(e.to); if(!a) rev.set(e.to,a=[]); a.push([n.k,(e.c+e.pen)*(1+(seed?edgeNoise(seed,n.k,e.to):0))]); }
  const dist=new Map([[GOALK,0]]), open=[GOALK], done=new Set();
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(dist.get(open[i])<dist.get(open[bi])) bi=i;
    const u=open.splice(bi,1)[0]; if(done.has(u)) continue; done.add(u);
    const du=dist.get(u);
    for(const [v,c] of (rev.get(u)||[])){ const nd=du+c; if(!(dist.get(v)<=nd)){ dist.set(v,nd); open.push(v); } }
  }
  if(seed) return dist;
  g.dist=dist; g.ver=(g.ver||0)+1;
}
function botDist(g,A){
  if(A.distVer!==g.ver||A.distG!==g){ A.dist=computeDist(g,A.seed); A.distVer=g.ver; A.distG=g; }
  return A.dist;
}
function* buildGraph(g,seeds){
  const q=[];
  for(const [tx,ty] of seeds){ const k=tx+ty*W; if(!g.nodes.has(k)){ g.nodes.set(k,{k,tx,ty,edges:[],expanded:false}); q.push(k); } }
  while(q.length){ expandNode(g,q.shift(),q); yield; }
  computeDist(g);
}
function startGraphs(){
  G.graphs=new Map();
  for(const r of G.runners){
    if(!r.ai) continue;
    const sig=graphSig(r.st);
    if(!G.graphs.has(sig)){
      const g={done:false,nodes:new Map(),dist:new Map(),vr:makeVirtual(r.st),hz:buildHazard(r.st)};
      const seeds=G.runners.map(o=>{ const v=makeVirtual(r.st); v.x=(G.map.spawn[0]+o.id*1.3)*T; v.y=G.map.spawn[1]*T-v.h; return standCell(v); });
      g.it=buildGraph(g,seeds);
      G.graphs.set(sig,g);
    }
    r.ai.graph=G.graphs.get(sig);
  }
}
function pumpGraphs(ms){
  const t0=performance.now();
  for(const g of G.graphs.values()) if(!g.done) pumpGraph(g,Math.max(1,ms-(performance.now()-t0)));
}
/* Herse fermée entre deux cases : temps d'attente estimé */
function gatePen(n,e){
  let p=0;
  const a=Math.min(n.tx,e.tx), b=Math.max(n.tx,e.tx), y0=Math.min(n.ty,e.ty)-1, y1=Math.max(n.ty,e.ty);
  for(const g of G.gates){
    if(g.closed<=0&&g.k<=0) continue;
    if(g.x>=a&&g.x<=b&&g.y1>=y0&&g.y0<=y1) p=Math.max(p,g.closed+.6);
  }
  return p;
}
function chooseEdge(g,n,A){
  let best=null, bv=Infinity;
  const D=botDist(g,A);
  for(const e of n.edges){
    const d=e.to===GOALK?0:D.get(e.to);
    if(d===undefined) continue;
    const v=d+(e.c+e.pen)*(1+edgeNoise(A.seed,n.k,e.to))+2.5*(A.fail.get(n.k+'>'+e.to)||0)+gatePen(n,e);
    if(v<bv){ bv=v; best=e; }
  }
  if(best) return best;
  const [gx,gy]=G.map.goal;
  for(const e of n.edges){
    const v=Math.abs(gx-e.tx)+Math.abs(gy-e.ty)*.7+e.pen+3*(A.visits.get(e.to)||0);
    if(v<bv){ bv=v; best=e; }
  }
  return best;
}
/* Un piège cyclique proche va-t-il être actif pendant le passage ? */
function mustWait(r){
  for(const t of G.traps){
    if(Math.abs((t.tx+.5)*T-r.x)>6*T||Math.abs((t.ty+.5)*T-r.y)>6*T) continue;
    if((t.type==='flamme'&&!r.st.ignifuge)||(t.type==='glace'&&!r.st.antigel)){ if(t.len&&(t.t+t.phase)%3>=.35) return true; }
    else if(t.type==='pics'&&G.lethal&&!r.st.blinde){ const p=t.t%3; if(p<1.5||p>=1.95) return true; }
  }
  return false;
}
function botStep(r,h){
  const A=r.ai, I=A.inp;
  I.l=I.r=I.j=false; I.jP=false; I.dP=false;
  const g=A.graph;
  if(!g||!g.done) return I;
  if(r.hold>0||r.stun>0){ A.exec=null; return I; }
  if(A.exec){
    const X=A.exec;
    if(!r.onGround) X.air=true;
    const [tx,ty]=r.onGround?standCell(r):[0,0];
    const landed=X.k>1&&r.onGround&&(X.air||tx+ty*W!==X.from);
    if(landed||X.k*h>X.e.c+.8){
      if(!landed||(X.e.to!==GOALK&&tx+ty*W!==X.e.to)){ const fk=X.from+'>'+X.e.to; A.fail.set(fk,(A.fail.get(fk)||0)+1); }
      A.exec=null;
    }
    else return botExec(r,h);
  }
  if(!r.onGround) return I;
  const [tx,ty]=standCell(r), k=tx+ty*W;
  let n=g.nodes.get(k);
  if(!n||!n.expanded){
    if(A.expandBudget<=0) return I;
    A.expandBudget--;
    if(!n){ n={k,tx,ty,edges:[],expanded:false}; g.nodes.set(k,n); }
    SIM=true; try{ expandNode(g,k,null); computeDist(g); } finally{ SIM=false; }
  }
  if(A.cur!==k){ A.cur=k; A.timeAt=0; A.align=0; A.visits.set(k,(A.visits.get(k)||0)+1); }
  A.timeAt+=h;
  let e=chooseEdge(g,n,A);
  if(A.timeAt>4&&n.edges.length){ e=pick(n.edges); A.timeAt=0; }
  if(!e){
    A.wanderT-=h; I.r=true;
    if(A.wanderT<=0){ I.jP=true; I.j=true; A.wanderT=.8; }
    return I;
  }
  const dodge=pilonDodge(r,Math.sign(e.tx-n.tx)||e.P.d1||1);
  if(dodge!==null){ if(dodge){ I.l=dodge<0; I.r=dodge>0; } return I; }
  if(e.pen>=1&&A.wait<3.5&&mustWait(r)){ A.wait+=h; return I; }
  if(e.walk){ const d=Math.sign(e.tx-n.tx)||e.P.d1; I.l=d<0; I.r=d>0; return I; }
  const cx=n.tx*T+T/2-r.w/2, dx=cx-r.x;
  if(!r.under.belt&&!r.under.frag&&(Math.abs(dx)>3||Math.abs(r.vx)>30)&&A.align<.7){
    A.align+=h;
    if(Math.abs(dx)>3&&Math.abs(r.vx)<90){ I.l=dx<0; I.r=dx>0; }
    return I;
  }
  A.align=0; A.wait=0;
  A.exec={e,P:e.P,k:0,air:false,from:k};
  return botExec(r,h);
}
/* Pilon annoncé : s'en écarter (renvoie une direction) ou attendre (0). null si rien à craindre. */
function pilonDodge(r,dir){
  if(r.st.casque) return null;
  for(const p of G.pilons){
    if(p.state>1||p.top>r.y+r.h||p.land<r.y) continue;
    const a=p.x-4, b=p.x+p.w+4;
    if(r.x+r.w>a&&r.x<b){ const c=p.x+p.w/2; return (r.x+r.w/2<c)?-1:1; }
    const gap=dir>0?a-(r.x+r.w):r.x-b;
    if(gap>=0&&gap<1.6*T) return 0;
  }
  return null;
}
function botExec(r,h){
  const A=r.ai, I=A.inp, X=A.exec, P=X.P, t=X.k*h;
  const d=t<P.t1?P.d1:P.d2, j2k=P.j2?Math.round(P.j2/h):-1;
  I.l=d<0; I.r=d>0;
  I.j=t<P.jd||(j2k>=0&&X.k>=j2k&&t<P.j2+.3);
  I.jP=(X.k===0&&P.jd>0)||X.k===j2k;
  X.k++;
  return I;
}

/* ---------- Boucle ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now;
  try{ pollInputs(); }catch(e){ console.error(e); }
  try{ update(dt); }catch(e){ console.error(e); }
  try{ render(); }catch(e){ console.error(e); }
  try{ renderMini(); }catch(e){ console.error(e); }
}
function update(dt){
  animT+=dt;
  updateCamera(dt);
  if(!G) return;
  if(G.phase==='draft') updateDraft(dt);
  else if(G.phase==='place'){
    if(cfg.ai[3]) updateAiPlacement(dt);
    else{ G.timer-=dt; if(G.timer<=0) beginVerify(true); }
  }
  else if(G.phase==='verify') updateVerify();
  else if(G.phase==='countdown'){
    pumpGraphs(22);
    G.timer-=dt;
    if(G.timer<=0){ G.phase='run'; G.timer=runTime(); renderHud(); }
  }
  else if(G.phase==='run'){
    pumpGraphs(10);
    for(const r of G.runners) if(r.ai) r.ai.expandBudget=1;
    stepRun(dt);
    if(G.phase==='run') chronoHud(false);
  }
  if(G.flash){ G.flash.t-=dt; if(G.flash.t<=0) G.flash=null; }
  if(G.toast){ G.toast.t-=dt; if(G.toast.t<=0) G.toast=null; }
  G.shake=Math.max(0,G.shake-dt*30);
  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=700*dt; p.life-=dt; }
  G.parts=G.parts.filter(p=>p.life>0);
}
function burst(x,y,color,n,sp){
  if(SIM||!G) return;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=sp*(.3+Math.random()*.7);
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,life:.4+Math.random()*.5,color,s:3+Math.random()*4}); }
}

/* ---------- Rendu ---------- */

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){

    else if(fr==='idle'){ sy=1+Math.sin(animT*3+r.id)*.025; sx=2-sy; }
    else if(fr==='jump'&&r.vy<-250){ sy=1.07; sx=.94; }
    else if((fr==='fall'||fr==='jump')&&r.vy>350){ sy=1.05; sx=.96; }
  }
  if(r.landT>0&&!set.land){ const k=r.landT/.16; sy=1-.18*k; sx=1+.15*k; }
  ctx.save();
  ctx.translate(fx,fy+bob);
  ctx.rotate(rot);
  ctx.scale((r.facing<0?-1:1)*sx,sy);
  if(F.im.complete&&F.im.naturalWidth) ctx.drawImage(F.im,-F.ax*dw,-dh,dw,dh);
  else { ctx.fillStyle=r.color; ctx.strokeStyle=INK; ctx.lineWidth=2.5; rr(ctx,-r.w/2,-r.h,r.w,r.h,6); ctx.fill(); ctx.stroke(); }
  ctx.restore();
  const top=fy+bob-dh*sy;
  if(r.shield>0){ ctx.strokeStyle='#5BC0EB'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.ellipse(fx,fy-dh*sy/2,dw*.5+4,dh*sy*.55+4,0,0,Math.PI*2); ctx.stroke(); }
  if(frozen){
    ctx.fillStyle='rgba(189,230,242,.6)'; ctx.strokeStyle='#5BA8C4'; ctx.lineWidth=2;
    const bw=Math.min(dw,48)+8; ctx.fillRect(fx-bw/2,top-4,bw,fy-top+4); ctx.strokeRect(fx-bw/2,top-4,bw,fy-top+4);
  }else if(r.hold>0||r.stun>0){
    ctx.fillStyle='#F2C14E'; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    for(let i=0;i<3;i++){ const a=animT*9+i*2.1; ctx.beginPath(); ctx.arc(fx+Math.cos(a)*12,top-5+Math.sin(a)*3,3,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
  }
  const lab='J'+(r.id+1)+(r.ai?' IA':''), ly=top-((r.stun>0||r.hold>0)?11:3);
  ctx.font='11px Bungee'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.strokeStyle='#F1E4C8'; ctx.lineWidth=3; ctx.strokeText(lab,fx,ly);
  ctx.fillStyle=r.color; ctx.fillText(lab,fx,ly);
}
function drawPlacement(){
  const x0=Math.max(0,Math.floor(cam.x/T)), x1=Math.min(W,Math.ceil((cam.x+viewW())/T)+1);
  ctx.strokeStyle='rgba(46,34,25,.10)'; ctx.lineWidth=1; ctx.beginPath();
  for(let x=x0;x<=x1;x++){ ctx.moveTo(x*T+.5,0); ctx.lineTo(x*T+.5,WH); }
  for(let y=0;y<=H;y++){ ctx.moveTo(x0*T,y*T+.5); ctx.lineTo(x1*T,y*T+.5); }
  ctx.stroke();
  for(const z of [G.map.safeS,G.map.safeG]){
    ctx.save(); ctx.beginPath(); ctx.rect(z[0]*T,z[1]*T,z[2]*T,z[3]*T); ctx.clip();
    ctx.fillStyle='rgba(241,228,200,.25)'; ctx.fillRect(z[0]*T,z[1]*T,z[2]*T,z[3]*T);
    ctx.strokeStyle='rgba(46,34,25,.18)'; ctx.lineWidth=2; ctx.beginPath();
    for(let k=z[0]*T-WH;k<(z[0]+z[2])*T;k+=14){ ctx.moveTo(k,0); ctx.lineTo(k+WH,WH); }
    ctx.stroke(); ctx.restore();
  }
}
function drawPlacementTop(){
  for(const t of G.traps) if(t.round===G.round){ ctx.strokeStyle=TRAPPER_COLOR; ctx.lineWidth=2; ctx.strokeRect(t.tx*T+1,t.ty*T+1,T-2,T-2); }
  if(G.flash){ ctx.fillStyle='rgba(194,54,47,.5)'; ctx.fillRect(G.flash.tx*T,G.flash.ty*T,T,T); }
  if(!mouse.in||cfg.ai[3]||G.phase!=='place') return;
  const tx=Math.floor(mouse.x/T), ty=Math.floor(mouse.y/T);
  if(tx<0||ty<0||tx>=W||ty>=H) return;
  const err=canPlace(tx,ty,G.sel), dir=placeDir(G.sel,G.dir);
  ctx.save(); ctx.globalAlpha=.65;
  if(G.sel==='scie'||G.sel==='gant'){
    const [dx,dy]=DIRS[dir], ox=(tx+.5)*T, oy=(ty+.5)*T;
    ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+dx*3*T,oy+dy*3*T); ctx.stroke(); ctx.restore();
    if(G.sel==='scie') drawSawBlade(ctx,ox,oy,animT*.3); else drawGlove(ctx,ox,oy,dir);
  } else {
    if(G.sel==='flamme'||G.sel==='vent'||G.sel==='glace'){
      const fake={tx,ty,dir}, v=G.sel==='vent', len=rayLen(fake,v?6:G.sel==='glace'?4:3), R=rayRect(fake,len,v?0:7);
      ctx.fillStyle=v?'rgba(255,255,255,.6)':G.sel==='glace'?'rgba(189,230,242,.7)':'rgba(240,138,36,.6)'; ctx.fillRect(R.x,R.y,R.w,R.h);
    }
    drawTrap(ctx,G.sel,tx*T,ty*T,dir,null);
  }
  ctx.restore();
  ctx.strokeStyle=err?TRAPPER_COLOR:'#2E8B57'; ctx.lineWidth=3; ctx.strokeRect(tx*T+1.5,ty*T+1.5,T-3,T-3);
  if(err&&err!=='Occupé'){
    ctx.font='13px Bungee'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.strokeStyle='#F1E4C8'; ctx.lineWidth=4; ctx.strokeText(err,(tx+.5)*T,ty*T-4);
    ctx.fillStyle=TRAPPER_COLOR; ctx.fillText(err,(tx+.5)*T,ty*T-4);
  }
}
function pill(text,x,y,size,fill,color){
  ctx.font=size+'px Bungee'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const mw=ctx.measureText(text).width||text.length*size*.6;
  const w=mw+size*1.2, h=size*1.7;
  ctx.fillStyle=fill; ctx.strokeStyle=INK; ctx.lineWidth=3; rr(ctx,x-w/2,y-h/2,w,h,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle=color; ctx.fillText(text,x,y+1);
  return w;
}
let chronoTxt='';
function chronoHud(force){
  const lim=runTime(), left=Math.max(0,G.timer), urgent=left<10;
  const rec=REC[recKey()];
  const html='<span class="chrono'+(urgent?' urgent':'')+'">'+fmt(G.runT)+' s</span>'+
    '<small>Limite '+Math.ceil(left)+' s'+(rec?', record '+fmt(rec)+' s':'')+'</small>'+
    '<span class="bar'+(urgent?' urgent':'')+'"><i style="width:'+(left/lim*100).toFixed(1)+'%"></i></span>';
  if(force||html!==chronoTxt){ chronoTxt=html; $('#mid').innerHTML=html; }
}
function drawOffscreen(){
  for(const r of G.runners){
    if(!r.alive||r.finished) continue;
    const sx=(r.x+r.w/2-cam.x)*cam.s, sy=(r.y+r.h/2)*cam.s+offY();
    if(sx>=0&&sx<=VW) continue;
    const left=sx<0, ax=left?18:VW-18, ay=clamp(sy,20,VH-20);
    ctx.fillStyle=r.color; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    ctx.beginPath();
    if(left){ ctx.moveTo(ax-10,ay); ctx.lineTo(ax+8,ay-11); ctx.lineTo(ax+8,ay+11); }
    else{ ctx.moveTo(ax+10,ay); ctx.lineTo(ax-8,ay-11); ctx.lineTo(ax-8,ay+11); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function render(){
  if(!ctx) return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#4A3628'; ctx.fillRect(0,0,VW,VH);
  const s=cam.s, sh=G&&!reduceMotion?G.shake:0;
  const jx=sh?(Math.random()-.5)*sh:0, jy=sh?(Math.random()-.5)*sh:0;
  ctx.setTransform(s,0,0,s,-cam.x*s+jx,offY()+jy);
  ctx.drawImage(tc,0,0);
  if(!G){ ctx.setTransform(1,0,0,1,0,0); return; }
  if(G.phase==='place'||G.phase==='verify') drawPlacement();
  drawFlag();
  drawTraps();
  drawGates();
  ctx.fillStyle=G.lethal?'#3A3532':'#E58FA6';
  for(const b of G.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,G.lethal?6:8,0,Math.PI*2); ctx.fill(); if(!G.lethal){ ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke(); } }
  drawPilons();
  for(const r of G.runners) drawRunner(r);
  if(G.phase==='place'||G.phase==='verify') drawPlacementTop();
  for(const p of G.parts){ ctx.globalAlpha=clamp(p.life/.5,0,1); ctx.fillStyle=p.color; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); }
  ctx.globalAlpha=1;
  if(G.phase==='run'&&mouse.in&&!cfg.ai[3]){
    const k=1-G.pilonCd/pilonCdMax(), kg=1-G.gateCd/gateCdMax();
    ctx.strokeStyle=INK; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,15,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=k>=1?TRAPPER_COLOR:'#F1E4C8'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,15,-Math.PI/2,-Math.PI/2+Math.PI*2*k); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,8,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=kg>=1?'#F2C14E':'#F1E4C8'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,8,-Math.PI/2,-Math.PI/2+Math.PI*2*kg); ctx.stroke();
  }
  ctx.setTransform(1,0,0,1,0,0);
  if(G.phase==='run'||G.phase==='countdown') drawOffscreen();
  if(G.phase==='place'){
    if(cfg.ai[3]) pill(G.aiP&&G.aiP.stage==='graph'?'Le piégeur IA étudie la carte':'Le piégeur IA pose ses pièges',VW/2,30,18,TRAPPER_COLOR,'#fff');
    else pill('Pose '+Math.ceil(G.timer)+' s',VW/2,30,20,G.blocked?INK:TRAPPER_COLOR,'#fff');
  }else if(G.phase==='verify'){
    pill('Vérification du parcours',VW/2,30,18,'#F1E4C8',INK);
  }else if(G.phase==='countdown'){
    pill(String(Math.max(1,Math.ceil(G.timer))),VW/2,VH/2-40,54,'#F1E4C8',INK);
  }else if(G.phase==='run'){
    if(G.runT<1) pill('Partez',VW/2,VH/2-40,54,'#F1E4C8',INK);
  }
  if(G.toast) pill(G.toast.text,VW/2,G.phase==='run'?60:76,16,'#F2C14E',INK);
}

/* ---------- Interface HTML ---------- */
const ov=$('#ov'), dock=$('#dock');
function showOverlay(html){ ov.innerHTML=html; ov.hidden=false; const b=ov.querySelector('.btn'); if(b&&b.focus) b.focus({preventScroll:true}); }
function hideOverlay(){ if(document.activeElement&&ov.contains(document.activeElement)) document.activeElement.blur(); ov.hidden=true; ov.innerHTML=''; }
function seg(k,opts){
  return '<div class="seg">'+opts.map(([v,l])=>'<button data-act="opt" data-k="'+k+'" data-v="'+v+'" aria-pressed="'+(String(cfg[k])===String(v))+'">'+l+'</button>').join('')+'</div>';
}
function slotHTML(i,title,color,ctrl){
  const ia=cfg.ai[i];
  return '<div class="slot" style="--pc:'+color+'"><b>'+title+'</b><div class="seg">'+
    '<button data-act="slot" data-i="'+i+'" data-v="h" aria-pressed="'+(!ia)+'">Humain</button>'+
    '<button data-act="slot" data-i="'+i+'" data-v="ia" aria-pressed="'+ia+'">IA</button></div>'+
    '<small>'+(ia?'Joué par l’ordinateur':ctrl)+'</small></div>';
}
function renderMenu(){
  const cols=['var(--r1)','var(--r2)','var(--r3)','var(--trap)'], rot=[-5,3,-2,4,-4,2,-3,5,-1,3];
  const logo='TRAQUENARD'.split('').map((l,i)=>'<span style="--c:'+cols[i%4]+';--r:'+rot[i]+'deg">'+l+'</span>').join('');
  const L=cfg.mode==='L';
  const rules=L
    ?['Plusieurs couloirs mènent au drapeau : à chacun de choisir le sien.','Coureur arrivé : 1 point pour l’équipe. Coureur éliminé ou hors délai : 1 point au piégeur.','En course, le piégeur abat un pilon (clic gauche) et ferme des herses (clic droit).','Les pièges restent d’une manche à l’autre.']
    :['Aucun piège ne tue : ils repoussent, figent ou ralentissent. Chute : retour au départ.','Coureur hors délai : 1 point au piégeur. Coureur arrivé : 1 point pour l’équipe.','En course, le piégeur assomme au pilon (clic gauche) et ferme des herses (clic droit).','Les pièges restent d’une manche à l’autre.'];
  let slots='';
  for(let i=0;i<cfg.runners;i++) slots+=slotHTML(i,'<img src="'+SPR[CHARS[i]].idle.d+'" alt="">J'+(i+1)+' '+RNAMES[i],COLORS[i],SCHEMES[i].txt);
  slots+=slotHTML(3,'Piégeur','var(--trap)','Souris, R pivote, Q D défilent');
  ov.innerHTML='<div class="sheet"><h1 class="logo" aria-label="Traquenard">'+logo+'</h1>'+
    '<p>Les coureurs traversent la carte. Le piégeur la remplit, manche après manche.</p>'+
    '<div class="opts">'+
      '<label>Pièges</label>'+seg('mode',[['L','Létaux'],['N','Non létaux']])+
      '<label>Coureurs</label>'+seg('runners',[[2,'2 contre 1'],[3,'3 contre 1']])+
      '<label>Manches</label>'+seg('rounds',[[5,'5'],[7,'7'],[9,'9']])+
      '<label>Carte</label>'+seg('map',Object.keys(MAPS).map(k=>[k,MAPS[k].name]).concat([['alea','Au hasard']]))+
      '<label>Joueurs</label><div class="presets">'+
        '<button data-act="preset" data-v="trap">Solo piégeur</button>'+
        '<button data-act="preset" data-v="run">Solo coureur</button>'+
        '<button data-act="preset" data-v="all">Tous humains</button></div>'+
    '</div>'+
    '<div class="slots">'+slots+'</div>'+
    '<ul class="rules" style="margin-top:14px">'+rules.map(t=>'<li>'+t+'</li>').join('')+'</ul>'+
    '<div class="row-end"><button class="btn" data-act="start">Jouer</button></div></div>';
  ov.hidden=false;
}
function showMenu(){ renderMenu(); renderDock(); const b=ov.querySelector('.btn'); if(b&&b.focus) b.focus({preventScroll:true}); }
function cardHTML(a,who,i,d,owned,pc){
  const lvl=owned[a.id]||0, now=d.done&&d.chosen===i?lvl:lvl+1;
  let cls='card r'+a.r;
  if(d.done) cls+=d.chosen===i?' chosen':' off'; else if(d.sel===i&&!d.ai) cls+=' sel';
  return '<button class="'+cls+'" style="--pc:'+pc+'" data-act="pick" data-who="'+who+'" data-i="'+i+'"'+(d.done||d.ai?' disabled':'')+'>'+
    '<small>'+RARN[a.r]+(a.max>1?', niveau '+now:'')+'</small><strong>'+a.name+'</strong><span>'+a.desc+'</span></button>';
}
function renderDraft(){
  const d=G.draft;
  let h='<div class="sheet wide"><h2>Manche '+G.round+' sur '+cfg.rounds+' : une amélioration chacun</h2>'+
    '<p>Coureurs : gauche et droite pour choisir, saut pour valider. Piégeur : clic sur une carte.</p>';
  d.r.forEach((x,i)=>{
    const r=G.runners[i];
    const st=x.done?'Choisi':x.ai?'IA en réflexion':(d.boostR?'Rareté augmentée':SCHEMES[i].txt);
    h+='<div class="draft-row"><div class="who" style="--pc:'+r.color+'"><b><img src="'+SPR[CHARS[i]].idle.d+'" alt="">J'+(i+1)+' '+r.name+(x.ai?' IA':'')+'</b><span>'+st+'</span></div>'+
      x.cards.map((a,k)=>cardHTML(a,String(i),k,x,r.aug,r.color)).join('')+'</div>';
  });
  const t=d.t;
  const st=t.done?'Choisi':t.ai?'IA en réflexion':(d.boostT?'Rareté augmentée':'Clic sur une carte');
  h+='<div class="draft-row"><div class="who" style="--pc:var(--trap)"><b>Piégeur'+(t.ai?' IA':'')+'</b><span>'+st+'</span></div>'+
    t.cards.map((a,k)=>cardHTML(a,'t',k,t,G.trapper.aug,TRAPPER_COLOR)).join('')+'</div></div>';
  ov.innerHTML=h; ov.hidden=false;
}
function augList(aug,pool){
  const seen=new Set();
  const l=pool.filter(a=>aug[a.id]&&modeOk(a)&&!seen.has(a.id)&&seen.add(a.id)).map(a=>a.name+(aug[a.id]>1?' '+aug[a.id]:''));
  return l.length?l.join(', '):'aucune amélioration';
}
function renderResult(){
  const L=G.last;
  const rows=G.runners.map(r=>{
    let s, t='';
    if(r.finished){ s='Arrivé '+r.rank+(r.rank===1?'er':'e')+(r.record?', nouveau record':''); t=fmt(r.time)+' s'; }
    else { s=G.lethal&&r.cause!=='Temps écoulé'?'Éliminé : '+r.cause:'Hors délai'; t='-'; }
    if(!G.lethal&&r.falls) s+=', '+r.falls+(r.falls>1?' chutes':' chute');
    return '<tr style="--pc:'+r.color+'"><td>J'+(r.id+1)+' '+r.name+(r.ai?' IA':'')+'</td><td>'+s+'</td><td class="t">'+t+'</td></tr>';
  }).join('');
  const rec=REC[recKey()];
  showOverlay('<div class="sheet"><h2>Bilan de la manche '+G.round+'</h2>'+
    '<table class="res">'+rows+'</table>'+
    '<div class="pts"><div>Coureurs <b>+'+L.fin+'</b></div><div>Piégeur <b>+'+L.tPts+'</b></div>'+(rec?'<div>Record '+G.map.name+' <b>'+fmt(rec)+' s</b></div>':'')+'</div>'+
    (L.note?'<p>'+L.note+'</p>':'')+
    '<div class="row-end"><button class="btn" data-act="cont">'+(G.round>=cfg.rounds?'Voir le résultat':'Manche suivante')+'</button></div></div>');
}
function renderOver(){
  const a=G.teamScore,b=G.trapper.score;
  const title=a>b?'Les coureurs gagnent':b>a?'Le piégeur gagne':'Égalité';
  showOverlay('<div class="sheet"><h2>'+title+'</h2><p>Coureurs '+a+', piégeur '+b+'.</p>'+
    G.runners.map(r=>'<p class="augl"><b style="color:'+r.color+'">J'+(r.id+1)+' '+r.name+'</b> : '+augList(r.aug,RAUG)+'</p>').join('')+
    '<p class="augl"><b style="color:var(--trap)">Piégeur</b> : '+augList(G.trapper.aug,TAUG)+'</p>'+
    '<div class="row-end"><button class="btn alt" data-act="menu">Menu</button><button class="btn" data-act="again">Revanche</button></div></div>');
}
function renderHud(){
  const n=G?G.runners.length:cfg.runners;
  $('#rdots').innerHTML=COLORS.slice(0,n).map(c=>'<i style="background:'+c+'"></i>').join('');
  $('#sR').textContent=G?G.teamScore:0;
  $('#sT').textContent=G?G.trapper.score:0;
  const P={draft:'Améliorations',place:'Pose des pièges',verify:'Vérification',countdown:'Course',run:'Course',result:'Bilan',over:'Fin de partie'};
  if(G&&G.phase==='run'){ chronoHud(true); return; }
  $('#mid').innerHTML=G?'Manche '+G.round+' sur '+cfg.rounds+'<small>'+P[G.phase]+', '+G.map.name+(G.lethal?'':', sans élimination')+'</small>':'Traquenard<small>Menu</small>';
}
function renderDock(){
  if(G&&(G.phase==='place'||G.phase==='verify')&&!cfg.ai[3]){
    const tp=G.trapper;
    let h='<div class="budget">Points<b>'+tp.points+'</b></div>';
    unlockedList().forEach((t,i)=>{
      const c=costOf(t);
      h+='<button class="tool" data-act="tool" data-type="'+t+'" aria-pressed="'+(G.sel===t)+'" title="Touche '+((i+1)%10)+'"><canvas width="40" height="40" data-icon="'+t+'"></canvas><span>'+trapName(t)+'</span><em>'+(c===0?'Gratuit':c+' pt'+(c>1?'s':''))+'</em></button>';
    });
    h+='<div class="hint">'+(G.blocked?'Parcours bloqué : libère un passage':'R ou molette : pivoter<br>Clic droit : retirer<br>Q D, flèches : défiler')+'</div>';
    h+='<button class="btn" data-act="go"'+(G.phase==='verify'?' disabled':'')+'>Lancer la course</button>';
    dock.innerHTML=h;
    dock.querySelectorAll('canvas[data-icon]').forEach(c=>{
      const x=c.getContext('2d'); if(!x) return;
      const t=c.dataset.icon;
      x.translate(4,4);
      drawTrap(x,t,0,0,placeDir(t,G.dir),null);
    });
    return;
  }
  const n=G?G.runners.length:cfg.runners;
  let h='<div class="legend">';
  for(let i=0;i<n;i++) h+='<span><i style="background:'+COLORS[i]+'"></i>J'+(i+1)+' : '+(cfg.ai[i]?'IA':SCHEMES[i].txt)+'</span>';
  const running=G&&(G.phase==='run'||G.phase==='countdown');
  h+='<span><i style="background:var(--trap)"></i>Piégeur : '+(cfg.ai[3]?'IA':running?'clic gauche pilon, clic droit herse':'souris')+'</span></div>';
  dock.innerHTML=h;
}

function fit(){
  const s=$('#stage'); const aw=s.clientWidth-28, ah=s.clientHeight-28;
  let w=aw, h=w*VH/VW; if(h>ah){ h=ah; w=h*VW/VH; }
  cv.style.width=Math.max(200,w)+'px'; cv.style.height=Math.max(110,h)+'px';
}
addEventListener('resize',fit);

loadMap('triple');
fit(); renderHud(); showMenu();
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(G&&G.phase==='place') renderDock(); });
</script>
