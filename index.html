/* ---------- Boucle ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now;
  try{ pollInputs(); }catch(e){ console.error(e); }
  try{ update(dt); }catch(e){ console.error(e); }
  try{ render(); }catch(e){ console.error(e); }
  try{ renderMini(); }catch(e){ console.error(e); }
}
function update(dt){
  animT+=dt;
  updateCamera(dt);
  netTick(dt);
  if(!G) return;
  if(G.phase==='draft') updateDraft(dt);
  else if(G.phase==='place'){
    if(G.aiTrap){ if(authority()) updateAiPlacement(dt); }
    else if(canTrap()){ G.timer-=dt; if(G.timer<=0) beginVerify(true); }
    else G.timer=Math.max(0,G.timer-dt);
  }
  else if(G.phase==='verify') updateVerify();
  else if(G.phase==='countdown'){
    pumpGraphs(22);
    netLiveTick(dt);
    for(const r of G.runners) if(r.remote) puppetStep(r,dt);
    G.timer-=dt;
    if(G.timer<=0){ G.phase='run'; G.timer=runTime(); renderHud(); }
  }
  else if(G.phase==='run'){
    pumpGraphs(10);
    netLiveTick(dt);
    for(const r of G.runners) if(r.ai) r.ai.expandBudget=1;
    stepRun(dt);
    if(G.phase==='run') chronoHud(false);
  }
  if(G.flash){ G.flash.t-=dt; if(G.flash.t<=0) G.flash=null; }
  if(G.toast){ G.toast.t-=dt; if(G.toast.t<=0) G.toast=null; }
  G.shake=Math.max(0,G.shake-dt*30);
  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=700*dt; p.life-=dt; }
  G.parts=G.parts.filter(p=>p.life>0);
}
function burst(x,y,color,n,sp){
  if(SIM||!G) return;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=sp*(.3+Math.random()*.7);
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,life:.4+Math.random()*.5,color,s:3+Math.random()*4}); }
}

/* ---------- Rendu ---------- */
function isVoid(x,y){ for(let k=y;k<H;k++) if(terrain[k][x]) return false; return true; }
function drawTerrainCache(){
  tc.width=WW; tc.height=WH;
  const c=tc.getContext('2d'); if(!c) return;
  const art=artImg(curMap);
  if(art){ c.drawImage(art,0,0,WW,WH); return; }
  const sol=(x,y)=>x<0||x>=W||y<0||y>=H?true:!!terrain[y][x];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const px=x*T, py=y*T;
    if(terrain[y][x]){
      let deep=true;
      for(let a=-1;a<=1&&deep;a++) for(let b=-1;b<=1&&deep;b++) if(!sol(x+a,y+b)) deep=false;
      c.fillStyle=deep?'#6E4A2D':'#9A6A3E'; c.fillRect(px,py,T,T);
      if(!deep){
        c.fillStyle='rgba(46,34,25,.10)';
        c.fillRect(px+((x*7+y*3)%4)*7+2,py+((x*5+y)%3)*9+4,6,3);
        c.fillRect(px+((x*3+y*5)%4)*6+5,py+((x+y*7)%3)*8+15,4,3);
        if(!sol(x,y-1)){ c.fillStyle='#C99860'; c.fillRect(px,py,T,6); }
      }
    } else if(isVoid(x,y)){
      const k=clamp((y-12)/10,0,1);
      c.fillStyle='rgb('+Math.round(90-45*k)+','+Math.round(66-32*k)+','+Math.round(50-25*k)+')';
      c.fillRect(px,py,T,T);
    } else {
      c.fillStyle='#E7D3AC'; c.fillRect(px,py,T,T);
      c.fillStyle='rgba(46,34,25,.07)';
      c.fillRect(px,py+15,T,2); c.fillRect(px,py+31,T,1);
      c.fillRect(px+(y%2?8:24),py,2,15); c.fillRect(px+(y%2?24:8),py+17,2,14);
    }
  }
  c.strokeStyle=INK; c.lineWidth=3; c.beginPath();
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(!terrain[y][x]) continue; const px=x*T, py=y*T;
    if(!sol(x,y-1)){ c.moveTo(px,py+1.5); c.lineTo(px+T,py+1.5); }
    if(!sol(x,y+1)){ c.moveTo(px,py+T-1.5); c.lineTo(px+T,py+T-1.5); }
    if(!sol(x-1,y)){ c.moveTo(px+1.5,py); c.lineTo(px+1.5,py+T); }
    if(!sol(x+1,y)){ c.moveTo(px+T-1.5,py); c.lineTo(px+T-1.5,py+T); }
  }
  c.stroke();
}
const MS=3;
function drawMiniBase(m,gates){
  mini.width=W*MS; mini.height=H*MS;
  miniBase.width=W*MS; miniBase.height=H*MS;
  const c=miniBase.getContext('2d'); if(!c) return;
  const art=artImg(m);
  if(art) c.drawImage(art,0,0,W*MS,H*MS);
  else for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    c.fillStyle=terrain[y][x]?'#8B5E36':(isVoid(x,y)?'#2E2219':'#EADBB9');
    c.fillRect(x*MS,y*MS,MS,MS);
  }
  c.fillStyle='rgba(46,34,25,.35)';
  for(const g of gates) c.fillRect(g.x*MS,g.y0*MS,MS,(g.y1-g.y0+1)*MS);
  const [sx,sy]=m.spawn, [gx,gy]=m.goal;
  c.fillStyle='#3C9E4A'; c.fillRect(sx*MS-2,(sy-1)*MS,MS+3,MS);
  c.fillStyle=INK; c.fillRect(gx*MS,(gy-3)*MS,2,3*MS); c.fillRect(gx*MS+2,(gy-3)*MS,5,4);
}
function renderMini(){
  if(!mctx) return;
  mctx.drawImage(miniBase,0,0);
  if(!G) return;
  mctx.fillStyle=TRAPPER_COLOR;
  for(const t of G.traps) mctx.fillRect(t.tx*MS,t.ty*MS,MS,MS);
  mctx.fillStyle=INK;
  for(const g of G.gates) if(g.k>0) mctx.fillRect(g.x*MS,g.y0*MS,MS,(g.y1-g.y0+1)*MS*g.k);
  for(const r of G.runners){
    if(!r.alive||r.finished) continue;
    const x=(r.x+r.w/2)/T*MS, y=(r.y+r.h/2)/T*MS;
    mctx.fillStyle=INK; mctx.fillRect(x-3,y-3,6,6);
    mctx.fillStyle=r.color; mctx.fillRect(x-2,y-2,4,4);
  }
  mctx.strokeStyle='#F1E4C8'; mctx.lineWidth=2;
  mctx.strokeRect(cam.x/T*MS+1,1,viewW()/T*MS-2,H*MS-2);
}
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function drawTrap(c,type,x,y,dir,tm){
  c.save(); c.translate(x+T/2,y+T/2);
  c.lineWidth=2.5; c.strokeStyle=INK; c.lineJoin='round';
  if(type==='pics'){
    c.rotate(dir*Math.PI/2);
    let top=-13;
    if(tm&&G&&G.phase==='run'&&!picsOut(tm)){
      const left=3-(tm.t%3);
      top=left<.35?3+Math.sin(animT*60)*2:8;
    }
    c.fillStyle=top<0?'#C3C9CF':'#8A8F94';
    for(let i=0;i<3;i++){ const bx=-15+i*10; c.beginPath(); c.moveTo(bx,13); c.lineTo(bx+5,top); c.lineTo(bx+10,13); c.closePath(); c.fill(); c.stroke(); }
    c.fillStyle='#6B5A48'; c.fillRect(-16,11,32,5); c.strokeRect(-16,11,32,5);
  }else if(type==='bloc'){
    c.fillStyle='#C9904F'; c.fillRect(-15,-15,30,30); c.strokeRect(-15,-15,30,30);
    c.beginPath(); c.moveTo(-15,-6); c.lineTo(15,-6); c.moveTo(-15,6); c.lineTo(15,6); c.moveTo(-15,15); c.lineTo(15,-15); c.stroke();
  }else if(type==='fragile'){
    if(tm&&tm.broken>0){
      c.setLineDash([4,4]); c.strokeStyle='rgba(46,34,25,.45)'; c.strokeRect(-15,-15,30,30); c.setLineDash([]);
    }else{
      if(tm&&tm.crumble>0) c.translate(Math.sin(animT*90)*2,0);
      c.fillStyle='#DDB97F'; c.fillRect(-15,-15,30,30); c.strokeRect(-15,-15,30,30);
      c.beginPath(); c.moveTo(-15,-5); c.lineTo(15,-5); c.moveTo(-15,5); c.lineTo(15,5); c.stroke();
      c.lineWidth=1.8; c.beginPath(); c.moveTo(-3,-15); c.lineTo(2,-9); c.lineTo(-2,-2); c.lineTo(4,6); c.lineTo(1,15); c.stroke();
    }
  }else if(type==='glu'){
    c.fillStyle='#86B83C'; rr(c,-15,-15,30,30,7); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(-7,16,4,6,0,0,Math.PI*2); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(6,15,3,5,0,0,Math.PI*2); c.fill(); c.stroke();
    c.fillStyle='rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(-6,-8,6,3,-.4,0,Math.PI*2); c.fill();
  }else if(type==='ressort'){
    const sq=tm&&tm.squish>0?tm.squish*24:0;
    c.fillStyle='#6E5B48'; c.fillRect(-15,8,30,7); c.strokeRect(-15,8,30,7);
    c.beginPath(); c.moveTo(0,8);
    for(let i=1;i<=4;i++) c.lineTo(i%2?-10:10,8-i*(15-sq)/4);
    c.stroke();
    c.fillStyle='#C2362F'; c.fillRect(-15,-15+sq,30,8); c.strokeRect(-15,-15+sq,30,8);
  }else if(type==='tapis'){
    c.fillStyle='#4A4440'; rr(c,-16,-12,32,24,10); c.fill(); c.stroke();
    const d=DIRS[dir][0]||1, off=((animT*30)%10)*d;
    c.save(); c.beginPath(); c.rect(-12,-9,24,18); c.clip();
    c.strokeStyle='#F2C14E'; c.lineWidth=2.5;
    for(let k=-20;k<=20;k+=10){ const xx=k+off; c.beginPath(); c.moveTo(xx-3*d,-6); c.lineTo(xx+3*d,0); c.lineTo(xx-3*d,6); c.stroke(); }
    c.restore();
  }else if(type==='canon'){
    c.fillStyle='#6E5B48'; c.fillRect(-15,-15,30,30); c.strokeRect(-15,-15,30,30);
    const a=tm&&tm.aim?Math.atan2(tm.aim[1],tm.aim[0]):Math.atan2(DIRS[dir][1],DIRS[dir][0]);
    const soft=G&&G.mode==='N';
    c.save(); c.rotate(a); c.fillStyle=soft?'#E58FA6':'#3A3532'; c.fillRect(0,-6,19,12); c.strokeRect(0,-6,19,12); c.restore();
    c.fillStyle=soft?'#F6C9D4':'#4A4440'; c.beginPath(); c.arc(0,0,9,0,Math.PI*2); c.fill(); c.stroke();
  }else if(type==='mine'){
    const used=tm&&tm.used, fuse=tm&&tm.fuse>=0;
    c.globalAlpha*=used?.25:1;
    c.fillStyle='#3A3532'; c.beginPath(); c.ellipse(0,8,12,7,0,0,Math.PI*2); c.fill(); c.stroke();
    const on=fuse?Math.floor(animT*16)%2===0:Math.floor(animT*2)%2===0;
    const soft=G&&G.mode==='N';
    c.fillStyle=on?(soft?'#7FD3F0':'#FF3B30'):(soft?'#2C6E86':'#7A2420'); c.beginPath(); c.arc(0,3,3.5,0,Math.PI*2); c.fill(); c.stroke();
  }else if(type==='flamme'||type==='glace'){
    c.rotate(dir*Math.PI/2);
    c.fillStyle=type==='glace'?'#9FD3E6':'#8C96A1'; c.fillRect(-14,-10,28,25); c.strokeRect(-14,-10,28,25);
    c.fillStyle='#4A4440'; c.fillRect(-6,-16,12,7); c.strokeRect(-6,-16,12,7);
    if(type==='glace'){ c.strokeStyle='#FFFFFF'; c.lineWidth=2; c.beginPath(); c.moveTo(-6,3); c.lineTo(6,3); c.moveTo(0,-3); c.lineTo(0,9); c.moveTo(-4,-1); c.lineTo(4,7); c.moveTo(4,-1); c.lineTo(-4,7); c.stroke(); }
    else { c.fillStyle='#C2362F'; c.fillRect(-9,0,18,5); }
  }else if(type==='vent'){
    c.rotate(dir*Math.PI/2);
    c.fillStyle='#8C96A1'; c.fillRect(-15,-15,30,30); c.strokeRect(-15,-15,30,30);
    c.fillStyle='#E9EEF2'; c.beginPath(); c.arc(0,0,11,0,Math.PI*2); c.fill(); c.stroke();
    c.save(); c.rotate(animT*14); c.fillStyle='#4A4440';
    for(let i=0;i<3;i++){ c.rotate(Math.PI*2/3); c.beginPath(); c.ellipse(0,-5,3,6,0,0,Math.PI*2); c.fill(); }
    c.restore();
    c.fillStyle=INK; c.beginPath(); c.moveTo(-5,-13); c.lineTo(0,-19); c.lineTo(5,-13); c.closePath(); c.fill();
  }else if(type==='scie'||type==='gant'){
    c.rotate(dir*Math.PI/2);
    c.save(); c.setLineDash([3,3]); c.beginPath(); c.moveTo(0,0); c.lineTo(0,-17); c.stroke(); c.restore();
    c.rotate(-dir*Math.PI/2);
    if(type==='scie') drawSawBlade(c,0,0,0); else drawGlove(c,0,0,dir);
  }
  c.restore();
}
function drawSawBlade(c,x,y,rot){
  c.save(); c.translate(x,y); c.rotate(rot*9);
  c.fillStyle='#C3C9CF'; c.lineWidth=2.5; c.strokeStyle=INK; c.beginPath();
  for(let i=0;i<20;i++){ const a=i/20*Math.PI*2, rad=i%2?9:13; c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); }
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle='#4A4440'; c.beginPath(); c.arc(0,0,3.5,0,Math.PI*2); c.fill();
  c.restore();
}
function drawGlove(c,x,y,dir){
  c.save(); c.translate(x,y); c.rotate(dir*Math.PI/2);
  c.lineWidth=2.5; c.strokeStyle=INK;
  c.fillStyle='#F1E4C8'; c.fillRect(-6,6,12,7); c.strokeRect(-6,6,12,7);
  c.fillStyle='#D8433A'; c.beginPath(); c.ellipse(0,-2,11,10,0,0,Math.PI*2); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(-9,1,4,6,-.4,0,Math.PI*2); c.fill(); c.stroke();
  c.fillStyle='rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(3,-6,4,2.5,-.3,0,Math.PI*2); c.fill();
  c.restore();
}
function drawTraps(){
  const run=G.phase==='run'||G.phase==='countdown'||G.phase==='result';
  for(const t of G.traps){
    if(t.type==='scie'||t.type==='gant'){
      const [dx,dy]=DIRS[t.dir], ox=(t.tx+.5)*T, oy=(t.ty+.5)*T;
      ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle='rgba(46,34,25,.45)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+dx*3*T,oy+dy*3*T); ctx.stroke(); ctx.restore();
      ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(ox,oy,4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ox+dx*3*T,oy+dy*3*T,4,0,Math.PI*2); ctx.fill();
    }
    if(t.type==='vent'&&t.len){
      const R=t.rect, [dx,dy]=DIRS[t.dir];
      ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fillRect(R.x,R.y,R.w,R.h);
      ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2;
      for(let i=0;i<4;i++){
        const k=((animT*1.6+i/4)%1);
        ctx.beginPath();
        if(dx){ const x=dx>0?R.x+k*R.w:R.x+R.w-k*R.w, y=R.y+5+i*7; ctx.moveTo(x,y); ctx.lineTo(x+dx*12,y); }
        else{ const y=dy>0?R.y+k*R.h:R.y+R.h-k*R.h, x=R.x+5+i*7; ctx.moveTo(x,y); ctx.lineTo(x,y+dy*12); }
        ctx.stroke();
      }
    }
    if((t.type==='flamme'||t.type==='glace')&&t.len&&run){
      const s=flameState(t), R=t.rect, ice=t.type==='glace';
      if(s===2){
        ctx.fillStyle=ice?'#BDE6F2':'#F08A24'; ctx.fillRect(R.x,R.y,R.w,R.h);
        ctx.fillStyle=ice?'#FFFFFF':'#F7D046';
        const [dx]=DIRS[t.dir], wob=Math.sin(animT*40)*2;
        if(dx) ctx.fillRect(R.x,R.y+5+wob,R.w,R.h-10); else ctx.fillRect(R.x+5+wob,R.y,R.w-10,R.h);
      }else if(s===1){
        ctx.fillStyle=(ice?'rgba(189,230,242,':'rgba(240,138,36,')+(.25+.25*Math.sin(animT*30))+')'; ctx.fillRect(R.x,R.y,R.w,R.h);
      }
    }
  }
  for(const t of G.traps){
    if(t.type==='scie'||t.type==='gant'){
      const p=run?sawPos(t):{x:(t.tx+.5)*T,y:(t.ty+.5)*T};
      if(t.type==='scie') drawSawBlade(ctx,p.x,p.y,run?t.t:animT*.2);
      else{ const goingOut=Math.sin(t.t*1.7)>=0; drawGlove(ctx,p.x,p.y,run&&!goingOut?(t.dir+2)%4:t.dir); }
    }
    else drawTrap(ctx,t.type,t.tx*T,t.ty*T,t.dir,t);
  }
}
function drawGates(){
  const run=G.phase==='run';
  const hover=run&&mouse.in&&canTrap()?gateNear(mouse.x,mouse.y):null;
  for(const g of G.gates){
    const x=g.x*T, y0=g.y0*T, len=(g.y1-g.y0+1)*T, ext=g.k*len;
    if(ext>1){
      ctx.fillStyle='rgba(46,34,25,.25)'; ctx.fillRect(x+2,y0,T-4,ext);
      ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath();

      for(let yy=y0+18;yy<y0+ext-4;yy+=26){ ctx.moveTo(x+2,yy); ctx.lineTo(x+T-2,yy); }
      ctx.stroke();
      ctx.fillStyle=G.lethal?'#C3C9CF':'#6B5A48';
      for(const bx of [6,16,26]){ ctx.beginPath(); ctx.moveTo(x+bx-4,y0+ext-6); ctx.lineTo(x+bx,y0+ext+(G.lethal?3:0)); ctx.lineTo(x+bx+4,y0+ext-6); ctx.closePath(); ctx.fill(); ctx.lineWidth=2; ctx.stroke(); }
    } else {
      ctx.fillStyle=G.lethal?'#C3C9CF':'#6B5A48'; ctx.strokeStyle=INK; ctx.lineWidth=2;
      for(const bx of [6,16,26]){ ctx.beginPath(); ctx.moveTo(x+bx-4,y0); ctx.lineTo(x+bx,y0+7); ctx.lineTo(x+bx+4,y0); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }
    ctx.fillStyle='#4A4440'; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    ctx.fillRect(x-4,y0-7,T+8,8); ctx.strokeRect(x-4,y0-7,T+8,8);
    if(G.phase==='place'){
      ctx.save(); ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(46,34,25,.5)'; ctx.lineWidth=2; ctx.strokeRect(x+2,y0+2,T-4,len-4); ctx.restore();
    }

      ctx.strokeStyle=G.gateCd<=0&&g.k<=0?TRAPPER_COLOR:'rgba(46,34,25,.5)'; ctx.lineWidth=3;

}
function drawPilons(){

function drawFlag(){

  ctx.fillStyle=INK; ctx.fillRect(x,top,5,gy*T-top);

function runnerFrame(r){
  if(r.remote&&r.netFr) return r.netFr;
  const set=IMG[r.skin];
  if(r.dashT>0) return set.slide?'slide':'run';
  if(!r.onGround) return r.vy<0?'jump':(set.fall?'fall':'jump');
  if(r.landT>0&&set.land) return 'land';
  if(Math.abs(r.vx)>30&&r.hold<=0) return 'run';
  return 'idle';
}
function drawRunner(r){
  if(!r.alive||r.finished) return;
  if(r.blink>0&&Math.floor(animT*20)%2) return;
  const set=IMG[r.skin], fr=runnerFrame(r), F=set[fr]||set.idle;
  const sc=SPR_H*r.st.size/set.idle.h, dw=F.w*sc, dh=F.h*sc;
  const fx=r.x+r.w/2, fy=r.y+r.h+1;
  let sx=1, sy=1, rot=0, bob=0;
  const frozen=r.hold>0&&r.holdKind==='glace';
  if(!frozen){
    if(fr==='run'){ rot=.05; }
    else if(fr==='idle'){ sy=1+Math.sin(animT*3+r.id)*.025; sx=2-sy; }
    else if(fr==='jump'&&r.vy<-250){ sy=1.07; sx=.94; }
    else if((fr==='fall'||fr==='jump')&&r.vy>350){ sy=1.05; sx=.96; }
  }
  if(r.landT>0&&!set.land){ const k=r.landT/.16; sy=1-.18*k; sx=1+.15*k; }
  ctx.save();
  ctx.translate(fx,fy+bob);
  ctx.rotate(rot);
  ctx.scale((r.facing<0?-1:1)*sx,sy);
  const R=set.rig;
  if(fr==='run'&&R&&ready(R.body)&&R.legs.every(l=>ready(l.im))){
    /* course : jambes découpées qui pivotent à la hanche, dessinées derrière le corps */
    const s=(1-Math.cos(r.runPh||0))/2, ang=[-R.amp*s,R.amp*s], x0=-F.ax*dw;
    /* le corps remonte quand une jambe passe à la verticale : pas de pied sous le sol */
    let lift=0;
    R.legs.forEach((L,i)=>{ lift=Math.max(lift,L.py+L.tx*Math.sin(ang[i])+L.ty*Math.cos(ang[i])-R.ground); });
    const y0=-dh-lift*sc;
    R.legs.forEach((L,i)=>{
      ctx.save(); ctx.translate(x0+L.px*sc,y0+L.py*sc); ctx.rotate(ang[i]);
      ctx.drawImage(L.im,(L.x-L.px)*sc,(L.y-L.py)*sc,L.w*sc,L.h*sc);
      ctx.restore();
    });
    ctx.drawImage(R.body,x0,y0,dw,dh);
  }
  else if(ready(F.im)) ctx.drawImage(F.im,-F.ax*dw,-dh,dw,dh);
  else { ctx.fillStyle=r.color; ctx.strokeStyle=INK; ctx.lineWidth=2.5; rr(ctx,-r.w/2,-r.h,r.w,r.h,6); ctx.fill(); ctx.stroke(); }
  ctx.restore();
  const top=fy+bob-dh*sy;
  if(r.shield>0){ ctx.strokeStyle='#5BC0EB'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.ellipse(fx,fy-dh*sy/2,dw*.5+4,dh*sy*.55+4,0,0,Math.PI*2); ctx.stroke(); }
  if(frozen){
    ctx.fillStyle='rgba(189,230,242,.6)'; ctx.strokeStyle='#5BA8C4'; ctx.lineWidth=2;
    const bw=Math.min(dw,48)+8; ctx.fillRect(fx-bw/2,top-4,bw,fy-top+4); ctx.strokeRect(fx-bw/2,top-4,bw,fy-top+4);
  }else if(r.hold>0||r.stun>0){
    ctx.fillStyle='#F2C14E'; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    for(let i=0;i<3;i++){ const a=animT*9+i*2.1; ctx.beginPath(); ctx.arc(fx+Math.cos(a)*12,top-5+Math.sin(a)*3,3,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
  }
  const lab=r.label, ly=top-((r.stun>0||r.hold>0)?11:3);
  ctx.font='11px Bungee'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.strokeStyle='#F1E4C8'; ctx.lineWidth=3; ctx.strokeText(lab,fx,ly);
  ctx.fillStyle=r.color; ctx.fillText(lab,fx,ly);
}
function drawPlacement(){
  const x0=Math.max(0,Math.floor(cam.x/T)), x1=Math.min(W,Math.ceil((cam.x+viewW())/T)+1);
  ctx.strokeStyle='rgba(46,34,25,.10)'; ctx.lineWidth=1; ctx.beginPath();
  for(let x=x0;x<=x1;x++){ ctx.moveTo(x*T+.5,0); ctx.lineTo(x*T+.5,WH); }
  for(let y=0;y<=H;y++){ ctx.moveTo(x0*T,y*T+.5); ctx.lineTo(x1*T,y*T+.5); }
  ctx.stroke();
  for(const z of [G.map.safeS,G.map.safeG]){
    ctx.save(); ctx.beginPath(); ctx.rect(z[0]*T,z[1]*T,z[2]*T,z[3]*T); ctx.clip();
    ctx.fillStyle='rgba(241,228,200,.25)'; ctx.fillRect(z[0]*T,z[1]*T,z[2]*T,z[3]*T);
    ctx.strokeStyle='rgba(46,34,25,.18)'; ctx.lineWidth=2; ctx.beginPath();
    for(let k=z[0]*T-WH;k<(z[0]+z[2])*T;k+=14){ ctx.moveTo(k,0); ctx.lineTo(k+WH,WH); }
    ctx.stroke(); ctx.restore();
  }
}
function drawPlacementTop(){
  for(const t of G.traps) if(t.round===G.round){ ctx.strokeStyle=TRAPPER_COLOR; ctx.lineWidth=2; ctx.strokeRect(t.tx*T+1,t.ty*T+1,T-2,T-2); }
  if(G.flash){ ctx.fillStyle='rgba(194,54,47,.5)'; ctx.fillRect(G.flash.tx*T,G.flash.ty*T,T,T); }
  if(!mouse.in||!canTrap()||G.phase!=='place') return;
  const tx=Math.floor(mouse.x/T), ty=Math.floor(mouse.y/T);
  if(tx<0||ty<0||tx>=W||ty>=H) return;
  const err=canPlace(tx,ty,G.sel), dir=placeDir(G.sel,G.dir);
  ctx.save(); ctx.globalAlpha=.65;
  if(G.sel==='scie'||G.sel==='gant'){
    const [dx,dy]=DIRS[dir], ox=(tx+.5)*T, oy=(ty+.5)*T;
    ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+dx*3*T,oy+dy*3*T); ctx.stroke(); ctx.restore();
    if(G.sel==='scie') drawSawBlade(ctx,ox,oy,animT*.3); else drawGlove(ctx,ox,oy,dir);
  } else {
    if(G.sel==='flamme'||G.sel==='vent'||G.sel==='glace'){
      const fake={tx,ty,dir}, v=G.sel==='vent', len=rayLen(fake,v?6:G.sel==='glace'?4:3), R=rayRect(fake,len,v?0:7);
      ctx.fillStyle=v?'rgba(255,255,255,.6)':G.sel==='glace'?'rgba(189,230,242,.7)':'rgba(240,138,36,.6)'; ctx.fillRect(R.x,R.y,R.w,R.h);
    }
    drawTrap(ctx,G.sel,tx*T,ty*T,dir,null);
  }
  ctx.restore();
  ctx.strokeStyle=err?TRAPPER_COLOR:'#2E8B57'; ctx.lineWidth=3; ctx.strokeRect(tx*T+1.5,ty*T+1.5,T-3,T-3);
  if(err&&err!=='Occupé'){
    ctx.font='13px Bungee'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.strokeStyle='#F1E4C8'; ctx.lineWidth=4; ctx.strokeText(err,(tx+.5)*T,ty*T-4);
    ctx.fillStyle=TRAPPER_COLOR; ctx.fillText(err,(tx+.5)*T,ty*T-4);
  }
}
function pill(text,x,y,size,fill,color){
  ctx.font=size+'px Bungee'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const mw=ctx.measureText(text).width||text.length*size*.6;
  const w=mw+size*1.2, h=size*1.7;
  ctx.fillStyle=fill; ctx.strokeStyle=INK; ctx.lineWidth=3; rr(ctx,x-w/2,y-h/2,w,h,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle=color; ctx.fillText(text,x,y+1);
  return w;
}
let chronoTxt='';

function drawOffscreen(){
  for(const r of G.runners){
    if(!r.alive||r.finished) continue;
    const sx=(r.x+r.w/2-cam.x)*cam.s, sy=(r.y+r.h/2)*cam.s+offY();
    if(sx>=0&&sx<=VW) continue;
    const left=sx<0, ax=left?18:VW-18, ay=clamp(sy,20,VH-20);
    ctx.fillStyle=r.color; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    ctx.beginPath();
    if(left){ ctx.moveTo(ax-10,ay); ctx.lineTo(ax+8,ay-11); ctx.lineTo(ax+8,ay+11); }
    else{ ctx.moveTo(ax+10,ay); ctx.lineTo(ax-8,ay-11); ctx.lineTo(ax-8,ay+11); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function render(){
  if(!ctx) return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#4A3628'; ctx.fillRect(0,0,VW,VH);
  const s=cam.s, sh=G&&!reduceMotion?G.shake:0;
  const jx=sh?(Math.random()-.5)*sh:0, jy=sh?(Math.random()-.5)*sh:0;
  ctx.setTransform(s,0,0,s,-cam.x*s+jx,offY()+jy);
  ctx.drawImage(tc,0,0);
  if(!G){ ctx.setTransform(1,0,0,1,0,0); return; }
  if(G.phase==='place'||G.phase==='verify') drawPlacement();
  drawFlag();
  drawTraps();
  drawGates();
  ctx.fillStyle=G.lethal?'#3A3532':'#E58FA6';
  for(const b of G.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,G.lethal?6:8,0,Math.PI*2); ctx.fill(); if(!G.lethal){ ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke(); } }
  drawPilons();
  for(const r of G.runners) drawRunner(r);
  if(G.phase==='place'||G.phase==='verify') drawPlacementTop();
  for(const p of G.parts){ ctx.globalAlpha=clamp(p.life/.5,0,1); ctx.fillStyle=p.color; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); }
  ctx.globalAlpha=1;
  if(G.phase==='run'&&mouse.in&&canTrap()){
    const k=1-G.pilonCd/pilonCdMax(), kg=1-G.gateCd/gateCdMax();
    ctx.strokeStyle=INK; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,15,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=k>=1?TRAPPER_COLOR:'#F1E4C8'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,15,-Math.PI/2,-Math.PI/2+Math.PI*2*k); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,8,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=kg>=1?'#F2C14E':'#F1E4C8'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,8,-Math.PI/2,-Math.PI/2+Math.PI*2*kg); ctx.stroke();
  }
  ctx.setTransform(1,0,0,1,0,0);
  if(G.phase==='run'||G.phase==='countdown') drawOffscreen();
  if(G.phase==='place'){
    if(G.aiTrap) pill(G.aiP&&G.aiP.stage==='graph'?'Le piégeur IA étudie la carte':'Le piégeur IA pose ses pièges',VW/2,30,18,TRAPPER_COLOR,'#fff');
    else if(canTrap()) pill('Pose '+Math.ceil(G.timer)+' s',VW/2,30,20,G.blocked?INK:TRAPPER_COLOR,'#fff');
    else pill('Le piégeur pose ses pièges, '+Math.ceil(G.timer)+' s',VW/2,30,18,TRAPPER_COLOR,'#fff');
  }else if(G.phase==='verify'){
    pill(G.waitHost?'Pièges posés, départ imminent':'Vérification du parcours',VW/2,30,18,'#F1E4C8',INK);
  }else if(G.phase==='countdown'){
    pill(String(Math.max(1,Math.ceil(G.timer))),VW/2,VH/2-40,54,'#F1E4C8',INK);
  }else if(G.phase==='run'){
    if(G.runT<1) pill('Partez',VW/2,VH/2-40,54,'#F1E4C8',INK);
  }
  if(G.toast) pill(G.toast.text,VW/2,G.phase==='run'?60:76,16,'#F2C14E',INK);
}

    '<button data-act="slot" data-i="'+i+'" data-v="h" aria-pressed="'+(!ia)+'">Humain</button>'+
    '<button data-act="slot" data-i="'+i+'" data-v="ia" aria-pressed="'+ia+'">IA</button></div>'+
    '<small>'+(ia?'Joué par l’ordinateur':ctrl)+'</small></div>';
}
function renderMenu(){
  const cols=['var(--r1)','var(--r2)','var(--r3)','var(--trap)'], rot=[-5,3,-2,4,-4,2,-3,5,-1,3];
  const logo='TRAQUENARD'.split('').map((l,i)=>'<span style="--c:'+cols[i%4]+';--r:'+rot[i]+'deg">'+l+'</span>').join('');
  const L=cfg.mode==='L';
  const rules=L
    ?['Plusieurs couloirs mènent au drapeau : à chacun de choisir le sien.','Coureur arrivé : 1 point pour l’équipe. Coureur éliminé ou hors délai : 1 point au piégeur.','En course, le piégeur abat un pilon (clic gauche) et ferme des herses (clic droit).','Les pièges restent d’une manche à l’autre.']
    :['Aucun piège ne tue : ils repoussent, figent ou ralentissent. Chute : retour au départ.','Coureur hors délai : 1 point au piégeur. Coureur arrivé : 1 point pour l’équipe.','En course, le piégeur assomme au pilon (clic gauche) et ferme des herses (clic droit).','Les pièges restent d’une manche à l’autre.'];
  let slots='';
  for(let i=0;i<cfg.runners;i++) slots+=slotHTML(i,'<button class="skinbtn" data-act="skin" data-i="'+i+'" title="Changer de personnage"><img src="'+SPR[cfg.skins[i]].idle.d+'" alt=""></button>J'+(i+1)+' '+SKIN_NAMES[cfg.skins[i]],COLORS[i],SCHEMES[i].txt);
  slots+=slotHTML(3,'Piégeur','var(--trap)','Souris, R pivote, Q D défilent');
  ov.innerHTML='<div class="sheet"><h1 class="logo" aria-label="Traquenard">'+logo+'</h1>'+
    '<p>Les coureurs traversent la carte. Le piégeur la remplit, manche après manche.</p>'+
    '<div class="opts">'+
      '<label>Pièges</label>'+seg('mode',[['L','Létaux'],['N','Non létaux']])+
      '<label>Coureurs</label>'+seg('runners',[[2,'2 contre 1'],[3,'3 contre 1']])+
      '<label>Manches</label>'+seg('rounds',[[5,'5'],[7,'7'],[9,'9']])+
      '<label>Carte</label>'+seg('map',Object.keys(MAPS).map(k=>[k,MAPS[k].name]).concat([['alea','Au hasard']]))+
      '<label>Joueurs</label><div class="presets">'+
        '<button data-act="preset" data-v="trap">Solo piégeur</button>'+
        '<button data-act="preset" data-v="run">Solo coureur</button>'+
        '<button data-act="preset" data-v="all">Tous humains</button></div>'+
    '</div>'+
    '<div class="slots">'+slots+'</div>'+
    '<ul class="rules" style="margin-top:14px">'+rules.map(t=>'<li>'+t+'</li>').join('')+'</ul>'+
    '<div class="row-end"><button class="btn alt" data-act="online">Jouer en ligne</button><button class="btn" data-act="start">Jouer</button></div></div>';
  ov.hidden=false;
}
function showMenu(){ renderMenu(); renderDock(); const b=ov.querySelector('.btn'); if(b&&b.focus) b.focus({preventScroll:true}); }
function cardHTML(a,who,i,d,owned,pc){
  const lvl=owned[a.id]||0, now=d.done&&d.chosen===i?lvl:lvl+1;
  const locked=d.ai||(NET.on&&seatOf(who)!==NET.seat);
  let cls='card r'+a.r;
  if(d.done) cls+=d.chosen===i?' chosen':' off'; else if(d.sel===i&&!locked) cls+=' sel';
  return '<button class="'+cls+'" style="--pc:'+pc+'" data-act="pick" data-who="'+who+'" data-i="'+i+'"'+(d.done||locked?' disabled':'')+'>'+
    '<small>'+RARN[a.r]+(a.max>1?', niveau '+now:'')+'</small><strong>'+a.name+'</strong><span>'+a.desc+'</span></button>';
}
function renderDraft(){
  const d=G.draft;
  let h='<div class="sheet wide"><h2>Manche '+G.round+' sur '+G.rounds+' : une amélioration chacun</h2>'+
    '<p>Coureurs : gauche et droite pour choisir, saut pour valider. Piégeur : clic sur une carte.</p>';
  d.r.forEach((x,i)=>{
    const r=G.runners[i];
    const other=NET.on&&seatOf(String(i))!==NET.seat;
    const st=x.done?'Choisi':x.ai?'IA en réflexion':other?'Choix en cours':(d.boostR?'Rareté augmentée':(NET.on?'Flèches ou clic, saut pour valider':SCHEMES[i].txt));
    h+='<div class="draft-row"><div class="who" style="--pc:'+r.color+'"><b><img src="'+SPR[r.skin].idle.d+'" alt="">'+r.label+(NET.on?'':' '+r.name)+'</b><span>'+st+'</span></div>'+
      x.cards.map((a,k)=>cardHTML(a,String(i),k,x,r.aug,r.color)).join('')+'</div>';
  });
  const t=d.t;
  const st=t.done?'Choisi':t.ai?'IA en réflexion':(NET.on&&NET.seat!=='t')?'Choix en cours':(d.boostT?'Rareté augmentée':'Clic sur une carte');
  h+='<div class="draft-row"><div class="who" style="--pc:var(--trap)"><b>Piégeur'+(t.ai?' IA':'')+'</b><span>'+st+'</span></div>'+
    t.cards.map((a,k)=>cardHTML(a,'t',k,t,G.trapper.aug,TRAPPER_COLOR)).join('')+'</div></div>';
  ov.innerHTML=h; ov.hidden=false;
}
function augList(aug,pool){
  const seen=new Set();
  const l=pool.filter(a=>aug[a.id]&&modeOk(a)&&!seen.has(a.id)&&seen.add(a.id)).map(a=>a.name+(aug[a.id]>1?' '+aug[a.id]:''));
  return l.length?l.join(', '):'aucune amélioration';
}
function renderResult(){
  const L=G.last;
  const rows=G.runners.map(r=>{
    let s, t='';
    if(r.finished){ s='Arrivé '+r.rank+(r.rank===1?'er':'e')+(r.record?', nouveau record':''); t=fmt(r.time)+' s'; }
    else { s=G.lethal&&r.cause!=='Temps écoulé'?'Éliminé : '+r.cause:'Hors délai'; t='-'; }
    if(!G.lethal&&r.falls) s+=', '+r.falls+(r.falls>1?' chutes':' chute');
    return '<tr style="--pc:'+r.color+'"><td>'+r.label+(NET.on?'':' '+r.name)+'</td><td>'+s+'</td><td class="t">'+t+'</td></tr>';
  }).join('');
  const rec=REC[recKey()];
  showOverlay('<div class="sheet"><h2>Bilan de la manche '+G.round+'</h2>'+
    '<table class="res">'+rows+'</table>'+
    '<div class="pts"><div>Coureurs <b>+'+L.fin+'</b></div><div>Piégeur <b>+'+L.tPts+'</b></div>'+(rec?'<div>Record '+G.map.name+' <b>'+fmt(rec)+' s</b></div>':'')+'</div>'+
    (L.note?'<p>'+L.note+'</p>':'')+
    (authority()?'<div class="row-end"><button class="btn" data-act="cont">'+(G.round>=G.rounds?'Voir le résultat':'Manche suivante')+'</button></div>':'<p>En attente de l’hôte.</p>')+'</div>');
}
function renderOver(){
  const a=G.teamScore,b=G.trapper.score;
  const title=a>b?'Les coureurs gagnent':b>a?'Le piégeur gagne':'Égalité';
  showOverlay('<div class="sheet"><h2>'+title+'</h2><p>Coureurs '+a+', piégeur '+b+'.</p>'+
    G.runners.map(r=>'<p class="augl"><b style="color:'+r.color+'">'+r.label+' '+SKIN_NAMES[r.skin]+'</b> : '+augList(r.aug,RAUG)+'</p>').join('')+
    '<p class="augl"><b style="color:var(--trap)">Piégeur</b> : '+augList(G.trapper.aug,TAUG)+'</p>'+
    (NET.on?(NET.host?'<div class="row-end"><button class="btn alt" data-act="lobby">Retour au salon</button><button class="btn" data-act="again">Revanche</button></div>':'<p>En attente de l’hôte.</p>'):'<div class="row-end"><button class="btn alt" data-act="menu">Menu</button><button class="btn" data-act="again">Revanche</button></div>')+'</div>');
}
function renderHud(){
  const n=G?G.runners.length:cfg.runners;
  $('#rdots').innerHTML=COLORS.slice(0,n).map(c=>'<i style="background:'+c+'"></i>').join('');
  $('#sR').textContent=G?G.teamScore:0;
  $('#sT').textContent=G?G.trapper.score:0;
  const P={draft:'Améliorations',place:'Pose des pièges',verify:'Vérification',countdown:'Course',run:'Course',result:'Bilan',over:'Fin de partie'};
  if(G&&G.phase==='run'){ chronoHud(true); return; }
  $('#mid').innerHTML=G?'Manche '+G.round+' sur '+G.rounds+'<small>'+P[G.phase]+', '+G.map.name+(G.lethal?'':', sans élimination')+'</small>':'Traquenard<small>Menu</small>';
}
function renderDock(){
  if(G&&(G.phase==='place'||G.phase==='verify')&&canTrap()&&!G.aiTrap){
    const tp=G.trapper;
    let h='<div class="budget">Points<b>'+tp.points+'</b></div>';
    unlockedList().forEach((t,i)=>{
      const c=costOf(t);
      h+='<button class="tool" data-act="tool" data-type="'+t+'" aria-pressed="'+(G.sel===t)+'" title="Touche '+((i+1)%10)+'"><canvas width="40" height="40" data-icon="'+t+'"></canvas><span>'+trapName(t)+'</span><em>'+(c===0?'Gratuit':c+' pt'+(c>1?'s':''))+'</em></button>';
    });
    h+='<div class="hint">'+(G.blocked?'Parcours bloqué : libère un passage':'R ou molette : pivoter<br>Clic droit : retirer<br>Q D, flèches : défiler')+'</div>';
    h+='<button class="btn" data-act="go"'+(G.phase==='verify'?' disabled':'')+'>Lancer la course</button>';
    dock.innerHTML=h;
    dock.querySelectorAll('canvas[data-icon]').forEach(c=>{
      const x=c.getContext('2d'); if(!x) return;
      const t=c.dataset.icon;
      x.translate(4,4);
      drawTrap(x,t,0,0,placeDir(t,G.dir),null);
    });
    return;
  }
  const n=G?G.runners.length:cfg.runners;
  let h='<div class="legend">';
  for(let i=0;i<n;i++) h+='<span><i style="background:'+COLORS[i]+'"></i>'+legendRunner(i)+'</span>';
  const running=G&&(G.phase==='run'||G.phase==='countdown');
  h+='<span><i style="background:var(--trap)"></i>Piégeur : '+(trapAI()?'IA':NET.on&&!canTrap()?(G&&G.setup&&G.setup.names[3]||'en ligne'):running?'clic gauche pilon, clic droit herse':'souris')+'</span></div>';
  dock.innerHTML=h;
}

function fit(){
  const s=$('#stage'); const aw=s.clientWidth-28, ah=s.clientHeight-28;
  let w=aw, h=w*VH/VW; if(h>ah){ h=ah; w=h*VW/VH; }
  cv.style.width=Math.max(200,w)+'px'; cv.style.height=Math.max(110,h)+'px';
}
addEventListener('resize',fit);

loadMap('triple');
fit(); renderHud(); showMenu();
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(G&&G.phase==='place') renderDock(); });
</script>
</body>
</html>
