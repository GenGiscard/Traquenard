<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traquenard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#C9A06A; --ink:#2E2219; --paper:#F1E4C8; --card:#FBF3E1;
  --trap:#C2362F; --r1:#2F6FD6; --r2:#3C9E4A; --r3:#E58A1F;
  --rar0:#8A7F70; --rar1:#3B78B8; --rar2:#C9971A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background-color:var(--kraft);
  background-image:radial-gradient(rgba(46,34,25,.10) 1px,transparent 1.2px);
  background-size:7px 7px;
  color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:500;
  overflow:hidden;
}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}

#hud{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 18px;min-height:58px}
.side{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.side b{font-family:Bungee;font-size:32px;line-height:1;font-weight:400}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:block}
#mid{text-align:center;font-family:Bungee;font-size:17px;line-height:1.15}
#mid small{display:block;font-family:'Barlow Semi Condensed';font-weight:600;font-size:15px}

#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#game{display:block;border:3px solid var(--ink);border-radius:6px;box-shadow:7px 7px 0 var(--ink);background:#A8C8CF;cursor:crosshair}

#dock{min-height:82px;padding:8px 18px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px 4px;min-width:84px;background:var(--card);border:3px solid var(--ink);border-radius:4px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tool canvas{width:36px;height:36px}
.tool span{font-weight:700;font-size:14px;line-height:1}
.tool em{font-style:normal;font-size:13px}
.tool[aria-pressed="true"]{background:var(--trap);color:#fff;transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--ink)}
.budget{font-family:Bungee;font-size:15px;text-align:center;padding:0 8px;line-height:1.1}
.budget b{display:block;font-size:30px;font-weight:400}
.hint{font-size:14px;font-weight:600;max-width:150px;line-height:1.2}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-weight:600;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;border:2px solid var(--ink);display:block}

.btn{font-family:Bungee;font-size:17px;background:var(--trap);color:#fff;border:3px solid var(--ink);border-radius:4px;padding:10px 18px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(46,34,25,.5)}
#ov[hidden]{display:none}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:4px;box-shadow:9px 9px 0 var(--ink);padding:22px 26px;width:100%;max-width:820px;max-height:100%;overflow:auto}
.sheet.wide{max-width:1100px}
.sheet h2{font-family:Bungee;font-weight:400;font-size:26px;line-height:1.1;margin-bottom:4px}
.sheet p{font-size:17px;margin-bottom:12px;max-width:65ch}

.logo{display:flex;flex-wrap:wrap;gap:5px;font-family:Bungee;font-weight:400;font-size:clamp(32px,6vw,70px);line-height:1;margin:4px 0 14px}
.logo span{display:inline-block;padding:6px 9px 2px;background:var(--c);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(var(--r))}

.opts{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;align-items:center;margin:8px 0 16px}
.opts label{font-weight:700;font-size:17px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--card);border:3px solid var(--ink);border-radius:4px;padding:5px 12px;font-weight:700;font-size:16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:14px}
.ctrl{border:3px solid var(--ink);border-left-width:10px;border-left-color:var(--pc);background:var(--card);padding:6px 10px;border-radius:4px;font-size:15px;line-height:1.25}
.ctrl b{display:block;font-family:Bungee;font-weight:400;font-size:15px}
.rules{font-size:16px;margin-bottom:16px;line-height:1.35}
.rules li{margin-left:18px}
.row-end{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.draft-row{display:grid;grid-template-columns:150px repeat(3,1fr);gap:10px;margin-top:12px}
.who{border-left:10px solid var(--pc);padding:4px 0 4px 10px;display:flex;flex-direction:column;justify-content:center}
.who b{font-family:Bungee;font-weight:400;font-size:18px}
.who span{font-size:14px;font-weight:600}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:3px solid var(--ink);border-top:9px solid var(--rc);border-radius:4px;padding:7px 10px 9px;cursor:pointer;min-height:92px}
.card small{font-weight:700;font-size:13px;color:var(--rc)}
.card strong{font-family:Bungee;font-weight:400;font-size:16px;line-height:1.1}
.card span{font-size:15px;line-height:1.2}
.card.sel{transform:translateY(-3px);box-shadow:5px 5px 0 var(--pc);outline:3px solid var(--pc);outline-offset:1px}
.card.chosen{box-shadow:5px 5px 0 var(--pc);outline:3px solid var(--pc)}
.card.off{opacity:.35}
.card:disabled{cursor:default}
.r0{--rc:var(--rar0)} .r1{--rc:var(--rar1)} .r2{--rc:var(--rar2)}

.res{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:17px}
.res td{padding:6px 8px;border-bottom:2px solid rgba(46,34,25,.2)}
.res td:first-child{border-left:10px solid var(--pc);font-weight:700}
.pts{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pts div{border:3px solid var(--ink);background:var(--card);padding:6px 14px;font-weight:700;font-size:17px;border-radius:4px}
.pts b{font-family:Bungee;font-weight:400;font-size:24px}
.augl{font-size:15px;margin:2px 0 6px}

@media (max-width:760px){
  .draft-row{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ .tool[aria-pressed="true"],.card.sel{transform:none} }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="side"><div class="dots" id="rdots"></div>Coureurs <b id="sR">0</b></div>
    <div id="mid">Traquenard<small id="phase">Menu</small></div>
    <div class="side">Piégeur <b id="sT">0</b><div class="dots"><i style="background:var(--trap)"></i></div></div>
  </header>
  <main id="stage">
    <canvas id="game" width="1280" height="704" aria-label="Terrain de jeu"></canvas>
    <div id="ov"></div>
  </main>
  <footer id="dock"></footer>
</div>

<script>
'use strict';
const T=32,W=40,H=22,WW=W*T,WH=H*T,INK='#2E2219';
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const COLORS=['#2F6FD6','#3C9E4A','#E58A1F'];
const RNAMES=['Bleu','Vert','Orange'];
const TRAPPER_COLOR='#C2362F';
const SCHEMES=[
  {left:'KeyA',right:'KeyD',jump:'KeyW',down:'KeyS',txt:'Q D, saut Z, dash S'},
  {left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',down:'ArrowDown',txt:'Flèches, saut \u2191, dash \u2193'},
  {left:'KeyJ',right:'KeyL',jump:'KeyI',down:'KeyK',txt:'J L, saut I, dash K'}
];
const PLACE_TIME=25;

const MAPS={
  atelier:{name:'Atelier',
    rects:[[0,19,8,3],[12,18,6,4],[22,19,6,3],[29,16,2,1],[32,17,8,5],[13,15,3,1],[18,12,3,1],[24,10,4,1]],
    spawn:[2,19],goal:[37,17],safeS:[0,15,7,4],safeG:[34,13,6,4]},
  tour:{name:'Tour',
    rects:[[0,19,6,3],[8,17,4,1],[14,19,8,3],[15,14,4,1],[9,12,4,1],[16,9,5,1],[21,13,2,1],[24,16,8,6],[26,11,3,1],[31,8,3,1],[34,5,6,1]],
    spawn:[2,19],goal:[37,5],safeS:[0,15,6,4],safeG:[34,1,6,4]},
  plaine:{name:'Plaine',
    rects:[[0,18,9,4],[12,18,7,4],[22,18,6,4],[31,18,9,4],[7,13,4,1],[16,12,5,1],[27,12,5,1],[20,7,3,1]],
    spawn:[2,18],goal:[37,18],safeS:[0,14,6,4],safeG:[34,14,6,4]}
};

const TRAPS={
  pics:{name:'Pics',cost:1,solid:false,rot:true},
  bloc:{name:'Caisse',cost:1,solid:true,rot:false},
  glu:{name:'Glu',cost:1,solid:true,rot:false},
  canon:{name:'Canon',cost:3,solid:true,rot:true},
  mine:{name:'Mine',cost:2,solid:false,rot:false},
  vent:{name:'Ventilateur',cost:2,solid:true,rot:true},
  scie:{name:'Scie',cost:3,solid:false,rot:true},
  flamme:{name:'Lance-flammes',cost:3,solid:true,rot:true}
};
const TORDER=['pics','bloc','glu','canon','mine','vent','scie','flamme'];

const RARN=['Commun','Rare','Légendaire'];
const RAUG=[
  {id:'sprint',name:'Sprint',desc:'+10 % de vitesse de course.',r:0,max:4},
  {id:'ressort',name:'Ressorts',desc:'Sauts 7 % plus hauts.',r:0,max:4},
  {id:'plume',name:'Plume',desc:'Gravité réduite de 8 %.',r:0,max:3},
  {id:'ventouse',name:'Ventouses',desc:'Glisse moins aux murs, saut mural plus fort.',r:0,max:3},
  {id:'antiglu',name:'Semelles téflon',desc:'La glu ne te ralentit plus.',r:0,max:1},
  {id:'leger',name:'Pas léger',desc:'Tu ne déclenches plus les mines.',r:0,max:1},
  {id:'bouclier',name:'Bouclier',desc:'Encaisse un coup mortel par manche.',r:1,max:2},
  {id:'mini',name:'Miniaturisation',desc:'Hitbox réduite de 12 %.',r:1,max:2},
  {id:'ignifuge',name:'Combinaison ignifugée',desc:'Immunisé aux lance-flammes.',r:1,max:1},
  {id:'dash',name:'Dash',desc:'Touche bas : ruée horizontale, recharge 1,5 s.',r:1,max:1},
  {id:'demineur',name:'Démineur',desc:'Détruit un piège au hasard au départ de chaque course.',r:1,max:3},
  {id:'double',name:'Double saut',desc:'Un saut supplémentaire en l\u2019air.',r:2,max:1},
  {id:'seconde',name:'Seconde chance',desc:'Réapparais au départ une fois par manche.',r:2,max:1},
  {id:'blinde',name:'Semelles blindées',desc:'Les pics deviennent un sol sûr pour toi.',r:2,max:1}
];
const TAUG=[
  {id:'credit',name:'Crédit',desc:'+2 points de pose par manche.',r:0,max:5},
  {id:'cadence',name:'Cadence',desc:'Canons 20 % plus rapides.',r:0,max:3},
  {id:'balistique',name:'Balistique',desc:'Projectiles 25 % plus rapides.',r:0,max:3},
  {id:'chrono',name:'Chrono serré',desc:'Course raccourcie de 5 s.',r:0,max:3},
  {id:'forge',name:'Forge',desc:'Enclume rechargée 1,5 s plus vite.',r:0,max:3},
  {id:'mine',name:'Mine',desc:'Débloque la mine à retardement.',r:0,max:1,unlock:'mine'},
  {id:'vent',name:'Ventilateur',desc:'Débloque le ventilateur qui repousse.',r:0,max:1,unlock:'vent'},
  {id:'scie',name:'Scie circulaire',desc:'Débloque la scie mobile.',r:1,max:1,unlock:'scie'},
  {id:'flamme',name:'Lance-flammes',desc:'Débloque le lance-flammes cyclique.',r:1,max:1,unlock:'flamme'},
  {id:'verglas',name:'Verglas',desc:'Les coureurs adhèrent moins au sol.',r:1,max:1},
  {id:'prime',name:'Prime',desc:'Si au moins un coureur tombe : +1 point bonus.',r:1,max:1},
  {id:'soldes',name:'Soldes',desc:'3 pics ou caisses gratuits par manche.',r:1,max:1},
  {id:'traqueur',name:'Canons traqueurs',desc:'Les canons visent le coureur le plus proche.',r:2,max:1},
  {id:'enclume2',name:'Enclume géante',desc:'Ton enclume est deux fois plus large.',r:2,max:1}
];

const $=s=>document.querySelector(s);
const cv=$('#game'), ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const inRect=(tx,ty,r)=>tx>=r[0]&&tx<r[0]+r[2]&&ty>=r[1]&&ty<r[1]+r[3];
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

let cfg={runners:3,rounds:7,map:'alea'};
let G=null, terrain=[], grid=[], animT=0, mouse={x:-99,y:-99,in:false};

/* ---------- Entrées ---------- */
const keys=new Set(), pressed=new Set();
const INP=[0,1,2].map(()=>({l:false,r:false,j:false,d:false,lP:false,rP:false,jP:false,dP:false}));
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if(!e.repeat){ pressed.add(e.code); onKey(e); }
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());

let padsOk=true;
function pollInputs(){
  let pads=[];
  if(padsOk){ try{ pads=navigator.getGamepads?navigator.getGamepads()||[]:[]; }catch(e){ padsOk=false; pads=[]; } }
  for(let i=0;i<3;i++){
    const S=SCHEMES[i];
    let l=keys.has(S.left),r=keys.has(S.right),j=keys.has(S.jump),d=keys.has(S.down);
    const p=pads&&pads[i];
    if(p){
      const b=k=>!!(p.buttons[k]&&p.buttons[k].pressed);
      const ax=p.axes[0]||0, ay=p.axes[1]||0;
      l=l||ax<-.4||b(14); r=r||ax>.4||b(15); j=j||b(0)||b(12); d=d||b(1)||b(2)||b(13)||ay>.6;
    }
    const I=INP[i];
    I.lP=(l&&!I.l)||pressed.has(S.left);
    I.rP=(r&&!I.r)||pressed.has(S.right);
    I.jP=(j&&!I.j)||pressed.has(S.jump);
    I.dP=(d&&!I.d)||pressed.has(S.down);
    I.l=l;I.r=r;I.j=j;I.d=d;
  }
  pressed.clear();
}

function onKey(e){
  if(!G) return;
  const btnFocus=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(G.phase==='place'){
    if(e.code==='KeyR') rotate(1);
    const m=/^Digit([1-8])$/.exec(e.code);
    if(m){ const list=TORDER.filter(t=>G.trapper.unlocked.has(t)); const t=list[+m[1]-1]; if(t){G.sel=t;renderDock();} }
  }
  if(e.code==='Enter'&&!btnFocus){
    if(G.phase==='result') afterResult();
    else if(G.phase==='over') newGame();
  }
}

cv.addEventListener('mousemove',e=>{ const p=toWorld(e); mouse.x=p.x; mouse.y=p.y; mouse.in=true; });
cv.addEventListener('mouseleave',()=>{ mouse.in=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{
  e.preventDefault(); if(!G) return;
  const p=toWorld(e);
  if(G.phase==='place'){ if(e.button===0) tryPlace(p); else if(e.button===2) tryRemove(p); }
  else if(G.phase==='run'&&e.button===0) dropAnvil(p.x);
});
cv.addEventListener('wheel',e=>{ if(G&&G.phase==='place'){ e.preventDefault(); rotate(e.deltaY>0?1:-1); } },{passive:false});
function toWorld(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left-cv.clientLeft)/cv.clientWidth*WW, y:(e.clientY-r.top-cv.clientTop)/cv.clientHeight*WH};
}

/* ---------- Clics interface ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const f=ACT[b.dataset.act]; if(f) f(b);
});
const ACT={
  opt(b){ cfg[b.dataset.k]=b.dataset.k==='map'?b.dataset.v:+b.dataset.v; renderMenu(); renderHud(); renderDock(); },
  start(){ newGame(); },
  tool(b){ if(G&&G.phase==='place'){ G.sel=b.dataset.type; renderDock(); } },
  go(){ if(G&&G.phase==='place') startRun(); },
  pick(b){ pickCard(b.dataset.who,+b.dataset.i); },
  cont(){ afterResult(); },
  again(){ newGame(); },
  menu(){ G=null; buildTerrain(MAPS.atelier); renderHud(); showMenu(); }
};

/* ---------- Carte ---------- */
const tc=document.createElement('canvas'); tc.width=WW; tc.height=WH;
function buildTerrain(map){
  terrain=[]; for(let y=0;y<H;y++) terrain.push(new Uint8Array(W));
  for(const [x,y,w,h] of map.rects) for(let j=y;j<y+h&&j<H;j++) for(let i=x;i<x+w&&i<W;i++) terrain[j][i]=1;
  drawTerrainCache();
}
function rebuildGrid(){
  grid=[]; for(let y=0;y<H;y++) grid.push(new Array(W).fill(null));
  if(G) for(const t of G.traps) grid[t.ty][t.tx]=t;
}
function solidAt(tx,ty,r){
  if(tx<0||tx>=W) return true;
  if(ty<0||ty>=H) return false;
  if(terrain[ty][tx]) return true;
  const t=grid[ty][tx]; if(!t) return false;
  if(TRAPS[t.type].solid) return true;
  return t.type==='pics'&&!!r&&r.st.blinde;
}
function goalZone(){ const [gx,gy]=G.map.goal; return {x:(gx-1)*T,y:(gy-3)*T,w:3*T,h:3*T}; }

/* ---------- Partie ---------- */
function newGame(){
  const k=cfg.map==='alea'?pick(Object.keys(MAPS)):cfg.map;
  G={mapKey:k,map:MAPS[k],round:0,phase:'draft',runners:[],teamScore:0,
     trapper:{aug:{},score:0,points:0,freeLeft:0,unlocked:new Set(['pics','bloc','glu','canon'])},
     traps:[],bullets:[],anvils:[],parts:[],timer:0,sel:'pics',dir:0,shake:0,toast:null,anvilCd:0};
  for(let i=0;i<cfg.runners;i++) G.runners.push({id:i,color:COLORS[i],name:RNAMES[i],aug:{},finishes:0});
  buildTerrain(G.map); rebuildGrid();
  G.runners.forEach(resetRunner);
  nextRound();
}
function nextRound(){ G.round++; startDraft(); }

function runnerStats(a){
  return {speed:235*(1+.1*(a.sprint||0)), jump:660*(1+.07*(a.ressort||0)), grav:1900*(1-.08*(a.plume||0)),
    air:a.double?1:0, dash:!!a.dash, grip:a.ventouse||0, shield:a.bouclier||0, second:a.seconde?1:0,
    antiglu:!!a.antiglu, ignifuge:!!a.ignifuge, leger:!!a.leger, blinde:!!a.blinde, size:1-.12*(a.mini||0)};
}
function resetRunner(r){
  r.st=runnerStats(r.aug);
  r.w=20*r.st.size; r.h=26*r.st.size;
  placeAtSpawn(r);
  r.alive=true; r.finished=false; r.cause=''; r.rank=0;
  r.shield=r.st.shield; r.second=r.st.second; r.air=r.st.air;
  r.dashCd=0; r.dashT=0; r.facing=1; r.invuln=0;
}
function placeAtSpawn(r){
  const [sx,sy]=G.map.spawn;
  r.x=(sx+r.id*1.3)*T; r.y=sy*T-r.h; r.vx=0; r.vy=0;
  r.onGround=true; r.coyote=0; r.jumpBuf=0; r.wallDir=0; r.wallLock=0; r.groundGlu=false; r.dashT=0;
}

/* ---------- Augments ---------- */
function rollCards(pool,owned,boosted){
  const w=boosted?[48,37,15]:[68,26,6];
  const avail=pool.filter(a=>(owned[a.id]||0)<a.max), out=[];
  while(out.length<3&&avail.length){
    let tot=avail.reduce((s,a)=>s+w[a.r],0), x=Math.random()*tot, k=0;
    for(;k<avail.length;k++){ x-=w[avail[k].r]; if(x<=0) break; }
    k=Math.min(k,avail.length-1); out.push(avail[k]); avail.splice(k,1);
  }
  return out;
}
function startDraft(){
  G.phase='draft';
  const bR=G.round>1&&G.teamScore<G.trapper.score, bT=G.round>1&&G.trapper.score<G.teamScore;
  G.draft={
    r:G.runners.map(r=>({cards:rollCards(RAUG,r.aug,bR),sel:0,done:false,chosen:-1})),
    t:{cards:rollCards(TAUG,G.trapper.aug,bT),sel:0,done:false,chosen:-1},
    boostR:bR,boostT:bT,closing:false

  G.draft.r.forEach(x=>{ if(!x.cards.length) x.done=true; });

}
function pickCard(who,i){

  const a=d.cards[i]; d.done=true; d.chosen=i; d.sel=i;
  const owner=who==='t'?G.trapper:G.runners[+who];

}
function checkDraftEnd(){
  if(!G.draft.closing&&G.draft.t.done&&G.draft.r.every(x=>x.done)){

  }
}
function updateDraftInput(){
  G.draft.r.forEach((d,i)=>{
    if(d.done) return; const I=INP[i], n=d.cards.length; let ch=false;
    if(I.lP){ d.sel=(d.sel+n-1)%n; ch=true; }
    if(I.rP){ d.sel=(d.sel+1)%n; ch=true; }
    if(I.jP){ pickCard(String(i),d.sel); return; }
    if(ch) renderDraft();

}

/* ---------- Pose ---------- */
function startPlacement(){
  hideOverlay();
  G.phase='place'; G.timer=PLACE_TIME;
  const tp=G.trapper;
  tp.points+=5+2*(tp.aug.credit||0);
  tp.freeLeft=tp.aug.soldes?3:0;
  if(!tp.unlocked.has(G.sel)) G.sel='pics';
  G.runners.forEach(resetRunner);
  G.bullets=[]; G.anvils=[];
  prepareTraps();
  renderHud(); renderDock();
}
function costOf(type){ if((type==='pics'||type==='bloc')&&G.trapper.freeLeft>0) return 0; return TRAPS[type].cost; }
function canPlace(tx,ty,type){
  if(tx<0||ty<0||tx>=W||ty>=H) return 'Hors carte';
  if(terrain[ty][tx]) return 'Sol';
  if(grid[ty][tx]) return 'Occupé';
  if(inRect(tx,ty,G.map.safeS)||inRect(tx,ty,G.map.safeG)) return 'Zone protégée';
  if(costOf(type)>G.trapper.points) return 'Budget insuffisant';
  return '';
}
function tryPlace(p){
  const tx=Math.floor(p.x/T), ty=Math.floor(p.y/T), type=G.sel;
  if(canPlace(tx,ty,type)){ G.flash={tx,ty,t:.25}; return; }
  const c=costOf(type), free=c===0&&TRAPS[type].cost>0;
  if(free) G.trapper.freeLeft--;
  G.trapper.points-=c;
  const t={type,tx,ty,dir:TRAPS[type].rot?G.dir:0,round:G.round,paid:c,free};
  G.traps.push(t); grid[ty][tx]=t;
  prepareTraps();
  burst((tx+.5)*T,(ty+.5)*T,'#F1E4C8',8,120);
  renderDock();
}
function tryRemove(p){
  const tx=Math.floor(p.x/T), ty=Math.floor(p.y/T);
  if(tx<0||ty<0||tx>=W||ty>=H) return;
  const t=grid[ty][tx]; if(!t||t.round!==G.round) return;
  G.traps.splice(G.traps.indexOf(t),1); grid[ty][tx]=null;
  G.trapper.points+=t.paid; if(t.free) G.trapper.freeLeft++;
  prepareTraps();
  burst((tx+.5)*T,(ty+.5)*T,'#8A7F70',8,100);
  renderDock();
}
function rotate(s){ G.dir=(G.dir+s+4)%4; renderDock(); }

/* ---------- Pièges : préparation ---------- */
function rayLen(t,max){
  const [dx,dy]=DIRS[t.dir]; let n=0;
  for(let k=1;k<=max;k++){ const x=t.tx+dx*k,y=t.ty+dy*k; if(x<0||x>=W||y<0||y>=H||solidAt(x,y,null)) break; n++; }
  return n;
}
function rayRect(t,len,ins){
  const [dx,dy]=DIRS[t.dir];
  if(dx) return {x:dx>0?(t.tx+1)*T:(t.tx-len)*T, y:t.ty*T+ins, w:len*T, h:T-2*ins};
  return {x:t.tx*T+ins, y:dy>0?(t.ty+1)*T:(t.ty-len)*T, w:T-2*ins, h:len*T};
}
function prepareTraps(){
  for(const t of G.traps){
    t.t=0; t.used=false; t.fuse=-1; t.phase=((t.tx*3+t.ty*5)%6)*.5;
    t.cd=.8+((t.tx*7+t.ty*3)%10)/10; t.aim=DIRS[t.dir].slice();
    if(t.type==='flamme'){ t.len=rayLen(t,3); t.rect=rayRect(t,t.len,7); }
    if(t.type==='vent'){ t.len=rayLen(t,6); t.rect=rayRect(t,t.len,0); }
  }
}

/* ---------- Course ---------- */
function runTime(){ return Math.max(25,42-5*(G.trapper.aug.chrono||0)); }
function anvilCdMax(){ return Math.max(2.5,7-1.5*(G.trapper.aug.forge||0)); }
function startRun(){
  G.phase='countdown'; G.timer=1.8;
  G.runners.forEach(resetRunner);
  const dem=G.runners.reduce((s,r)=>s+(r.aug.demineur||0),0);
  let n=0;
  for(let k=0;k<dem&&G.traps.length;k++){
    const t=pick(G.traps); G.traps.splice(G.traps.indexOf(t),1); n++;
    burst((t.tx+.5)*T,(t.ty+.5)*T,'#F2C14E',20,220);
  }
  rebuildGrid(); prepareTraps();
  G.toast=n?{text:'Démineur : '+n+(n>1?' pièges détruits':' piège détruit'),t:2.4}:null;
  G.bullets=[]; G.anvils=[]; G.anvilCd=1.5; G.finCount=0; G.endDelay=1.1;
  renderHud(); renderDock();
}
function stepRunner(r,h){
  const st=r.st, I=INP[r.id];
  r.invuln=Math.max(0,r.invuln-h); r.dashCd=Math.max(0,r.dashCd-h); r.wallLock=Math.max(0,r.wallLock-h);
  if(I.jP){ r.jumpBuf=.13; I.jP=false; } else r.jumpBuf=Math.max(0,r.jumpBuf-h);
  const move=(I.r?1:0)-(I.l?1:0);
  if(move&&r.wallLock<=0) r.facing=move;
  const glue=r.onGround&&r.groundGlu&&!st.antiglu;
  const ice=G.trapper.aug.verglas?.3:1;
  if(I.dP){ I.dP=false; if(st.dash&&r.dashCd<=0){ r.dashT=.16; r.dashCd=1.5; burst(r.x+r.w/2,r.y+r.h/2,r.color,8,120); } }
  if(r.dashT>0){ r.dashT-=h; r.vx=r.facing*640; r.vy=0; }
  else{
    const target=move*st.speed*(glue?.45:1);
    const acc=r.onGround?2800*ice:1800;
    if(r.wallLock<=0) r.vx+=clamp(target-r.vx,-acc*h,acc*h);
    r.vy+=st.grav*h;
    if(!I.j&&r.vy<0) r.vy+=st.grav*h*1.3;
    if(r.wallDir&&!r.onGround&&r.vy>0&&move===r.wallDir) r.vy=Math.min(r.vy,150*(1-.28*st.grip));
    r.vy=Math.min(r.vy,950);
  }
  if(r.jumpBuf>0){
    if(r.onGround||r.coyote>0){ r.vy=-st.jump*(glue?.6:1); r.jumpBuf=0; r.coyote=0; r.onGround=false; burst(r.x+r.w/2,r.y+r.h,'#E3D2AE',5,80); }
    else if(r.wallDir){ r.vy=-st.jump*.95; r.vx=-r.wallDir*(300+50*st.grip); r.facing=-r.wallDir; r.wallLock=.14; r.jumpBuf=0; }
    else if(r.air>0){ r.air--; r.vy=-st.jump*.88; r.jumpBuf=0; burst(r.x+r.w/2,r.y+r.h,'#FFFFFF',6,90); }
  }
  let wx=0;
  for(const t of G.traps){
    if(t.type!=='vent'||!t.len||!overlap(r,t.rect)) continue;
    const [dx,dy]=DIRS[t.dir];
    if(dx) wx+=dx*270;
    else if(dy<0) r.vy=Math.max(r.vy-2900*h,-520);
    else r.vy+=1600*h;
  }
  const vxT=r.vx+wx;
  r.x+=vxT*h; collideX(r,vxT);
  r.y+=r.vy*h; const landed=collideY(r);
  r.onGround=landed||groundBelow(r);
  if(r.onGround){ r.coyote=.1; r.air=st.air; } else r.coyote=Math.max(0,r.coyote-h);
  r.wallDir=r.onGround?0:wallCheck(r);
  if(r.y>WH+50) hurt(r,'Chute');
}
function collideX(r,v){
  const y0=Math.floor(r.y/T), y1=Math.floor((r.y+r.h-.01)/T);
  if(v>0){ const tx=Math.floor((r.x+r.w-.01)/T); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty,r)){ r.x=tx*T-r.w; r.vx=Math.min(r.vx,0); r.dashT=0; return; } }
  else if(v<0){ const tx=Math.floor(r.x/T); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty,r)){ r.x=(tx+1)*T; r.vx=Math.max(r.vx,0); r.dashT=0; return; } }
}
function collideY(r){
  const x0=Math.floor(r.x/T), x1=Math.floor((r.x+r.w-.01)/T);
  if(r.vy>0){ const ty=Math.floor((r.y+r.h-.01)/T); for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty,r)){ r.y=ty*T-r.h; r.vy=0; return true; } }
  else if(r.vy<0){ const ty=Math.floor(r.y/T); for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty,r)){ r.y=(ty+1)*T; r.vy=0; return false; } }
  return false;
}
function groundBelow(r){
  r.groundGlu=false;
  if(r.vy<0) return false;
  const ty=Math.floor((r.y+r.h+1)/T), x0=Math.floor(r.x/T), x1=Math.floor((r.x+r.w-.01)/T);
  let g=false;
  for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty,r)){ g=true; const t=grid[ty]&&grid[ty][tx]; if(t&&t.type==='glu') r.groundGlu=true; }
  return g;
}
function wallCheck(r){
  const y0=Math.floor((r.y+4)/T), y1=Math.floor((r.y+r.h-4)/T);
  const L=Math.floor((r.x-1)/T), R=Math.floor((r.x+r.w+1)/T);
  for(let ty=y0;ty<=y1;ty++){ if(solidAt(R,ty,r)) return 1; if(solidAt(L,ty,r)) return -1; }
  return 0;
}
function sawPos(t){
  const [dx,dy]=DIRS[t.dir], k=.5-.5*Math.cos(t.t*1.7);
  return {x:(t.tx+.5)*T+dx*3*T*k, y:(t.ty+.5)*T+dy*3*T*k};
}
function flameState(t){ const p=(t.t+t.phase)%3; return p<1.3?0:p<1.8?1:2; }
function circRect(cx,cy,rad,r){
  const nx=clamp(cx,r.x,r.x+r.w), ny=clamp(cy,r.y,r.y+r.h);
  return (cx-nx)**2+(cy-ny)**2<rad*rad;
}
function nearestRunner(x,y,max){
  let best=null,bd=max*max;
  for(const r of G.runners){ if(!r.alive||r.finished) continue; const d=(r.x+r.w/2-x)**2+(r.y+r.h/2-y)**2; if(d<bd){bd=d;best=r;} }
  return best;
}
function updateTraps(h){
  const tp=G.trapper.aug;
  for(const t of G.traps){
    t.t+=h;
    if(t.type==='canon'){
      const cx=(t.tx+.5)*T, cy=(t.ty+.5)*T;
      if(tp.traqueur){ const r=nearestRunner(cx,cy,15*T); if(r){ const ax=r.x+r.w/2-cx, ay=r.y+r.h/2-cy, L=Math.hypot(ax,ay)||1; t.aim=[ax/L,ay/L]; } }
      t.cd-=h;
      if(t.cd<=0){
        t.cd=2.4*Math.pow(.8,tp.cadence||0);
        const sp=300*(1+.25*(tp.balistique||0)), [dx,dy]=t.aim;
        G.bullets.push({x:cx+dx*26,y:cy+dy*26,vx:dx*sp,vy:dy*sp,life:6});
      }
    }
    if(t.type==='mine'&&t.fuse>=0){
      t.fuse-=h;
      if(t.fuse<0){
        t.used=true; t.fuse=-1;
        const cx=(t.tx+.5)*T, cy=(t.ty+.5)*T;
        burst(cx,cy,'#F2C14E',30,320); burst(cx,cy,'#C2362F',16,220); G.shake=10;
        for(const r of G.runners) if(r.alive&&!r.finished&&circRect(cx,cy,64,r)) hurt(r,'Mine');
      }
    }
  }
}
function updateBullets(h){
  for(const b of G.bullets){
    b.x+=b.vx*h; b.y+=b.vy*h; b.life-=h;
    if(b.x<0||b.x>WW||b.y<-40||b.y>WH||solidAt(Math.floor(b.x/T),Math.floor(b.y/T),null)){ b.life=0; burst(b.x,b.y,'#5A4A3C',4,60); continue; }
    for(const r of G.runners) if(r.alive&&!r.finished&&circRect(b.x,b.y,6,r)){ b.life=0; hurt(r,'Boulet'); break; }
  }
  G.bullets=G.bullets.filter(b=>b.life>0);
}
function dropAnvil(x){
  if(G.anvilCd>0) return;
  const w=G.trapper.aug.enclume2?72:36, ax=clamp(x-w/2,0,WW-w);
  G.anvils.push({x:ax,w,h:26,y:-36,vy:0,state:0,t:.75,land:anvilLand(ax,w)});
  G.anvilCd=anvilCdMax();
}
function anvilLand(x,w){
  const x0=Math.floor(x/T), x1=Math.floor((x+w-.01)/T);
  for(let ty=0;ty<H;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty,null)) return ty*T;
  return WH+60;
}
function updateAnvils(h){
  for(const a of G.anvils){
    if(a.state===0){ a.t-=h; if(a.t<=0) a.state=1; }
    else if(a.state===1){
      a.vy+=2600*h; a.y+=a.vy*h;
      for(const r of G.runners) if(r.alive&&!r.finished&&overlap(r,a)) hurt(r,'Enclume');
      if(a.y+a.h>=a.land){ a.y=a.land-a.h; a.state=2; a.t=.7; G.shake=9; burst(a.x+a.w/2,a.land,'#E3D2AE',14,200); }
    }
    else a.t-=h;
  }
  G.anvils=G.anvils.filter(a=>!(a.state===2&&a.t<=0)&&a.y<WH+80);
}
function checkHazards(r){
  const st=r.st;
  const x0=Math.floor(r.x/T)-1, x1=Math.floor((r.x+r.w)/T)+1, y0=Math.floor(r.y/T)-1, y1=Math.floor((r.y+r.h)/T)+1;
  if(!st.blinde) for(let ty=Math.max(0,y0);ty<=Math.min(H-1,y1);ty++) for(let tx=Math.max(0,x0);tx<=Math.min(W-1,x1);tx++){
    const t=grid[ty][tx];
    if(t&&t.type==='pics'&&overlap(r,{x:tx*T+5,y:ty*T+5,w:T-10,h:T-10})) hurt(r,'Pics');
  }
  for(const t of G.traps){
    if(!r.alive) return;
    if(t.type==='scie'){ const p=sawPos(t); if(circRect(p.x,p.y,13,r)) hurt(r,'Scie'); }
    else if(t.type==='flamme'&&t.len&&!st.ignifuge&&flameState(t)===2&&overlap(r,t.rect)) hurt(r,'Flammes');
    else if(t.type==='mine'&&!t.used&&t.fuse<0&&!st.leger){
      if(Math.hypot(r.x+r.w/2-(t.tx+.5)*T,r.y+r.h/2-(t.ty+.5)*T)<34) t.fuse=.42;
    }
  }
  if(r.alive&&!r.finished&&overlap(r,goalZone())){
    r.finished=true; r.rank=++G.finCount; r.finishes++;
    const c=r.x+r.w/2;
    for(const col of COLORS) burst(c,r.y,col,10,260);
  }
}
function hurt(r,cause){
  if(!r.alive||r.finished) return;
  const fall=cause==='Chute';
  if(!fall&&r.invuln>0) return;
  const cx=r.x+r.w/2, cy=r.y+r.h/2;
  if(!fall&&r.shield>0){ r.shield--; r.invuln=1.2; r.vy=-420; burst(cx,cy,'#5BC0EB',16,200); return; }
  burst(cx,clamp(cy,0,WH-4),r.color,26,280); G.shake=8;
  if(r.second>0){ r.second--; placeAtSpawn(r); r.invuln=1.5; G.toast={text:r.name+' : seconde chance',t:1.6}; return; }
  r.alive=false; r.cause=cause;
}
function stepRun(dt){
  const n=Math.ceil(dt/(1/120)), h=dt/n;
  for(let s=0;s<n;s++){
    for(const r of G.runners) if(r.alive&&!r.finished) stepRunner(r,h);
    updateTraps(h); updateBullets(h); updateAnvils(h);
    for(const r of G.runners) if(r.alive&&!r.finished) checkHazards(r);
  }
  G.anvilCd=Math.max(0,G.anvilCd-dt);
  G.timer-=dt;
  const active=G.runners.filter(r=>r.alive&&!r.finished);
  if(G.timer<=0){ active.forEach(r=>{ r.alive=false; r.cause='Temps écoulé'; }); endRun(); return; }
  if(!active.length){ G.endDelay-=dt; if(G.endDelay<=0) endRun(); }
}
function endRun(){
  G.phase='result';
  const fin=G.runners.filter(r=>r.finished).length, out=G.runners.length-fin;
  let tPts=0, note='';
  if(fin===0) note='Personne n\u2019est arrivé : la carte est jugée infranchissable, le piégeur ne marque rien.';
  else if(out===0) note='Tout le monde est arrivé : le piégeur ne marque rien.';
  else tPts=out+(G.trapper.aug.prime?1:0);
  G.teamScore+=fin; G.trapper.score+=tPts;
  G.last={fin,tPts,note};
  renderResult(); renderHud(); renderDock();
}
function afterResult(){
  if(!G||G.phase!=='result') return;
  if(G.round>=cfg.rounds){ G.phase='over'; renderOver(); renderHud(); renderDock(); }
  else { hideOverlay(); nextRound(); }
}

/* ---------- Boucle ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now;
  try{ pollInputs(); }catch(e){ console.error(e); }
  try{ update(dt); }catch(e){ console.error(e); }
  try{ render(); }catch(e){ console.error(e); }
}
function update(dt){
  animT+=dt;
  if(!G) return;
  if(G.phase==='draft') updateDraftInput();
  else if(G.phase==='place'){ G.timer-=dt; if(G.timer<=0) startRun(); }
  else if(G.phase==='countdown'){ G.timer-=dt; if(G.timer<=0){ G.phase='run'; G.timer=runTime(); renderHud(); } }
  else if(G.phase==='run') stepRun(dt);
  if(G.flash){ G.flash.t-=dt; if(G.flash.t<=0) G.flash=null; }
  if(G.toast){ G.toast.t-=dt; if(G.toast.t<=0) G.toast=null; }
  G.shake=Math.max(0,G.shake-dt*30);
  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=700*dt; p.life-=dt; }
  G.parts=G.parts.filter(p=>p.life>0);
}
function burst(x,y,color,n,sp){
  if(!G) return;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=sp*(.3+Math.random()*.7);
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,life:.4+Math.random()*.5,color,s:3+Math.random()*4}); }
}

/* ---------- Rendu ---------- */
const bg=document.createElement('canvas'); bg.width=WW; bg.height=WH;
function drawBackground(){
  const c=bg.getContext('2d'); if(!c) return;
  const g=c.createLinearGradient(0,0,0,WH); g.addColorStop(0,'#A8C8CF'); g.addColorStop(1,'#E3D2AE');
  c.fillStyle=g; c.fillRect(0,0,WW,WH);
  c.fillStyle='#F2C14E'; c.beginPath(); c.arc(1060,120,56,0,Math.PI*2); c.fill();
  c.lineWidth=3; c.strokeStyle='rgba(46,34,25,.3)'; c.stroke();
  const hill=(col,base,amp,f)=>{ c.fillStyle=col; c.beginPath(); c.moveTo(0,WH);
    for(let x=0;x<=WW;x+=16) c.lineTo(x,base+Math.sin(x*f)*amp+Math.sin(x*f*2.7+1)*amp*.35);
    c.lineTo(WW,WH); c.closePath(); c.fill(); c.stroke(); };
  hill('#A9C2A3',430,55,.004); hill('#8FAE8B',520,40,.007);
  c.fillStyle='rgba(255,255,255,.55)';
  for(const [x,y,s] of [[180,110,1],[520,70,.8],[760,150,1.1]]){ c.beginPath(); c.ellipse(x,y,60*s,18*s,0,0,Math.PI*2); c.ellipse(x+40*s,y-12*s,38*s,16*s,0,0,Math.PI*2); c.fill(); }
}
function drawTerrainCache(){
  const c=tc.getContext('2d'); if(!c) return;
  c.clearRect(0,0,WW,WH);
  const sol=(x,y)=>x>=0&&x<W&&y>=0&&y<H&&terrain[y][x];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(!terrain[y][x]) continue;
    const px=x*T, py=y*T;
    c.fillStyle='#A8743F'; c.fillRect(px,py,T,T);
    c.fillStyle='rgba(46,34,25,.09)'; for(let i=2;i<T;i+=6) c.fillRect(px+i,py,2,T);
    if(!sol(x,y-1)){ c.fillStyle='#7E9F4E'; c.fillRect(px,py,T,7); }
  }
  c.strokeStyle=INK; c.lineWidth=3; c.beginPath();
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(!terrain[y][x]) continue; const px=x*T, py=y*T;
    if(!sol(x,y-1)){ c.moveTo(px,py+1.5); c.lineTo(px+T,py+1.5); }
    if(!sol(x,y+1)&&y<H-1){ c.moveTo(px,py+T-1.5); c.lineTo(px+T,py+T-1.5); }
    if(!sol(x-1,y)&&x>0){ c.moveTo(px+1.5,py); c.lineTo(px+1.5,py+T); }
    if(!sol(x+1,y)&&x<W-1){ c.moveTo(px+T-1.5,py); c.lineTo(px+T-1.5,py+T); }
  }
  c.stroke();
}
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function drawTrap(c,type,x,y,dir,tm){
  c.save(); c.translate(x+T/2,y+T/2);
  c.lineWidth=2.5; c.strokeStyle=INK; c.lineJoin='round';
  if(type==='pics'){
    c.rotate(dir*Math.PI/2);
    c.fillStyle='#C3C9CF';
    for(let i=0;i<3;i++){ const bx=-15+i*10; c.beginPath(); c.moveTo(bx,13); c.lineTo(bx+5,-13); c.lineTo(bx+10,13); c.closePath(); c.fill(); c.stroke(); }
    c.fillStyle='#6B5A48'; c.fillRect(-16,11,32,5); c.strokeRect(-16,11,32,5);
  }else if(type==='bloc'){
    c.fillStyle='#C9904F'; c.fillRect(-15,-15,30,30); c.strokeRect(-15,-15,30,30);
    c.beginPath(); c.moveTo(-15,-6); c.lineTo(15,-6); c.moveTo(-15,6); c.lineTo(15,6); c.moveTo(-15,15); c.lineTo(15,-15); c.stroke();
  }else if(type==='glu'){
    c.fillStyle='#86B83C'; rr(c,-15,-15,30,30,7); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(-7,16,4,6,0,0,Math.PI*2); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(6,15,3,5,0,0,Math.PI*2); c.fill(); c.stroke();
    c.fillStyle='rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(-6,-8,6,3,-.4,0,Math.PI*2); c.fill();
  }else if(type==='canon'){
    c.fillStyle='#6E5B48'; c.fillRect(-15,-15,30,30); c.strokeRect(-15,-15,30,30);
    const a=tm&&tm.aim?Math.atan2(tm.aim[1],tm.aim[0]):Math.atan2(DIRS[dir][1],DIRS[dir][0]);
    c.save(); c.rotate(a); c.fillStyle='#3A3532'; c.fillRect(0,-6,19,12); c.strokeRect(0,-6,19,12); c.restore();
    c.fillStyle='#4A4440'; c.beginPath(); c.arc(0,0,9,0,Math.PI*2); c.fill(); c.stroke();
  }else if(type==='mine'){
    const used=tm&&tm.used, fuse=tm&&tm.fuse>=0;
    c.globalAlpha*=used?.25:1;
    c.fillStyle='#3A3532'; c.beginPath(); c.ellipse(0,8,12,7,0,0,Math.PI*2); c.fill(); c.stroke();
    const on=fuse?Math.floor(animT*16)%2===0:Math.floor(animT*2)%2===0;
    c.fillStyle=on?'#FF3B30':'#7A2420'; c.beginPath(); c.arc(0,3,3.5,0,Math.PI*2); c.fill(); c.stroke();
  }else if(type==='flamme'){
    c.rotate(dir*Math.PI/2);
    c.fillStyle='#8C96A1'; c.fillRect(-14,-10,28,25); c.strokeRect(-14,-10,28,25);
    c.fillStyle='#4A4440'; c.fillRect(-6,-16,12,7); c.strokeRect(-6,-16,12,7);
    c.fillStyle='#C2362F'; c.fillRect(-9,0,18,5);
  }else if(type==='vent'){
    c.rotate(dir*Math.PI/2);
    c.fillStyle='#8C96A1'; c.fillRect(-15,-15,30,30); c.strokeRect(-15,-15,30,30);
    c.fillStyle='#E9EEF2'; c.beginPath(); c.arc(0,0,11,0,Math.PI*2); c.fill(); c.stroke();
    c.save(); c.rotate(animT*14); c.fillStyle='#4A4440';
    for(let i=0;i<3;i++){ c.rotate(Math.PI*2/3); c.beginPath(); c.ellipse(0,-5,3,6,0,0,Math.PI*2); c.fill(); }
    c.restore();
    c.fillStyle=INK; c.beginPath(); c.moveTo(-5,-13); c.lineTo(0,-19); c.lineTo(5,-13); c.closePath(); c.fill();
  }else if(type==='scie'){
    c.rotate(dir*Math.PI/2);
    c.save(); c.setLineDash([3,3]); c.beginPath(); c.moveTo(0,0); c.lineTo(0,-17); c.stroke(); c.restore();
    drawSawBlade(c,0,0,0);
  }
  c.restore();
}
function drawSawBlade(c,x,y,rot){
  c.save(); c.translate(x,y); c.rotate(rot*9);
  c.fillStyle='#C3C9CF'; c.lineWidth=2.5; c.strokeStyle=INK; c.beginPath();
  for(let i=0;i<20;i++){ const a=i/20*Math.PI*2, rad=i%2?9:13; c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); }
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle='#4A4440'; c.beginPath(); c.arc(0,0,3.5,0,Math.PI*2); c.fill();
  c.restore();
}
function drawTraps(){
  const run=G.phase==='run'||G.phase==='countdown'||G.phase==='result';
  for(const t of G.traps){
    if(t.type==='scie'){
      const [dx,dy]=DIRS[t.dir], ox=(t.tx+.5)*T, oy=(t.ty+.5)*T;
      ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle='rgba(46,34,25,.45)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+dx*3*T,oy+dy*3*T); ctx.stroke(); ctx.restore();
      ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(ox,oy,4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ox+dx*3*T,oy+dy*3*T,4,0,Math.PI*2); ctx.fill();
    }
    if(t.type==='vent'&&t.len){
      const R=t.rect, [dx,dy]=DIRS[t.dir];
      ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(R.x,R.y,R.w,R.h);
      ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=2;
      for(let i=0;i<4;i++){
        const k=((animT*1.6+i/4)%1);
        ctx.beginPath();
        if(dx){ const x=dx>0?R.x+k*R.w:R.x+R.w-k*R.w, y=R.y+5+i*7; ctx.moveTo(x,y); ctx.lineTo(x+dx*12,y); }
        else{ const y=dy>0?R.y+k*R.h:R.y+R.h-k*R.h, x=R.x+5+i*7; ctx.moveTo(x,y); ctx.lineTo(x,y+dy*12); }
        ctx.stroke();
      }
    }
    if(t.type==='flamme'&&t.len&&run){
      const s=flameState(t), R=t.rect;
      if(s===2){
        ctx.fillStyle='#F08A24'; ctx.fillRect(R.x,R.y,R.w,R.h);
        ctx.fillStyle='#F7D046';
        const [dx]=DIRS[t.dir], wob=Math.sin(animT*40)*2;
        if(dx) ctx.fillRect(R.x,R.y+5+wob,R.w,R.h-10); else ctx.fillRect(R.x+5+wob,R.y,R.w-10,R.h);
      }else if(s===1){
        ctx.fillStyle='rgba(240,138,36,'+(.25+.25*Math.sin(animT*30))+')'; ctx.fillRect(R.x,R.y,R.w,R.h);
      }
    }
  }
  for(const t of G.traps){
    if(t.type==='scie'){ const p=run?sawPos(t):{x:(t.tx+.5)*T,y:(t.ty+.5)*T}; drawSawBlade(ctx,p.x,p.y,run?t.t:animT*.2); }
    else drawTrap(ctx,t.type,t.tx*T,t.ty*T,t.dir,t);
  }
}
function drawFlag(){
  const [gx,gy]=G.map.goal, x=gx*T+6, top=(gy-3)*T+4;
  ctx.fillStyle=INK; ctx.fillRect(x,top,5,gy*T-top);
  const w=44,h=28;
  for(let i=0;i<4;i++) for(let j=0;j<3;j++){
    ctx.fillStyle=(i+j)%2?'#FFFFFF':INK;
    const wav=Math.sin(animT*5+i*.9)*3;
    ctx.fillRect(x+5+i*w/4,top+j*h/3+wav,w/4+.5,h/3+.5);
  }
  const [sx,sy]=G.map.spawn;
  ctx.fillStyle='#C9904F'; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  ctx.fillRect(sx*T-36,sy*T-40,6,40); ctx.strokeRect(sx*T-36,sy*T-40,6,40);
  ctx.fillStyle='#F1E4C8'; rr(ctx,sx*T-62,sy*T-60,58,22,3); ctx.fill(); ctx.stroke();
  ctx.fillStyle=INK; ctx.font='11px Bungee'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Départ',sx*T-33,sy*T-48);
}
function drawRunner(r){
  if(!r.alive||r.finished) return;
  if(r.invuln>0&&Math.floor(animT*20)%2) return;
  const x=r.x,y=r.y,w=r.w,h=r.h;
  ctx.fillStyle=r.color; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rr(ctx,x,y,w,h,6); ctx.fill(); ctx.stroke();
  const ex=x+w/2+r.facing*3;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(ex-4,y+h*.36,3.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex+4,y+h*.36,3.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=INK;
  ctx.beginPath(); ctx.arc(ex-4+r.facing*1.4,y+h*.36,1.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex+4+r.facing*1.4,y+h*.36,1.8,0,Math.PI*2); ctx.fill();
  if(r.shield>0){ ctx.strokeStyle='#5BC0EB'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x+w/2,y+h/2,h*.85,0,Math.PI*2); ctx.stroke(); }
  ctx.font='11px Bungee'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.strokeStyle='#F1E4C8'; ctx.lineWidth=3; ctx.strokeText('J'+(r.id+1),x+w/2,y-4);
  ctx.fillStyle=r.color; ctx.fillText('J'+(r.id+1),x+w/2,y-4);
}
function drawAnvils(){
  for(const a of G.anvils){
    if(a.state===0){
      ctx.fillStyle='rgba(194,54,47,'+(.18+.12*Math.sin(animT*30))+')';
      ctx.fillRect(a.x,0,a.w,Math.min(a.land,WH));
    }
    ctx.fillStyle='#4A4440'; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    const y=a.state===0?4:a.y;
    ctx.beginPath(); ctx.moveTo(a.x,y); ctx.lineTo(a.x+a.w,y); ctx.lineTo(a.x+a.w-6,y+10); ctx.lineTo(a.x+a.w*.7,y+12);
    ctx.lineTo(a.x+a.w*.8,y+a.h); ctx.lineTo(a.x+a.w*.2,y+a.h); ctx.lineTo(a.x+a.w*.3,y+12); ctx.lineTo(a.x+6,y+10); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
}
function drawPlacement(){
  ctx.strokeStyle='rgba(46,34,25,.12)'; ctx.lineWidth=1; ctx.beginPath();
  for(let x=0;x<=W;x++){ ctx.moveTo(x*T+.5,0); ctx.lineTo(x*T+.5,WH); }
  for(let y=0;y<=H;y++){ ctx.moveTo(0,y*T+.5); ctx.lineTo(WW,y*T+.5); }
  ctx.stroke();
  for(const z of [G.map.safeS,G.map.safeG]){
    ctx.save(); ctx.beginPath(); ctx.rect(z[0]*T,z[1]*T,z[2]*T,z[3]*T); ctx.clip();
    ctx.fillStyle='rgba(241,228,200,.35)'; ctx.fillRect(z[0]*T,z[1]*T,z[2]*T,z[3]*T);
    ctx.strokeStyle='rgba(46,34,25,.25)'; ctx.lineWidth=2; ctx.beginPath();
    for(let k=-WH;k<WW;k+=14){ ctx.moveTo(k,0); ctx.lineTo(k+WH,WH); }
    ctx.stroke(); ctx.restore();
  }
}
function drawPlacementTop(){
  for(const t of G.traps) if(t.round===G.round){ ctx.strokeStyle=TRAPPER_COLOR; ctx.lineWidth=2; ctx.strokeRect(t.tx*T+1,t.ty*T+1,T-2,T-2); }
  if(G.flash){ ctx.fillStyle='rgba(194,54,47,.5)'; ctx.fillRect(G.flash.tx*T,G.flash.ty*T,T,T); }
  if(!mouse.in) return;
  const tx=Math.floor(mouse.x/T), ty=Math.floor(mouse.y/T);
  if(tx<0||ty<0||tx>=W||ty>=H) return;
  const err=canPlace(tx,ty,G.sel), dir=TRAPS[G.sel].rot?G.dir:0;
  ctx.save(); ctx.globalAlpha=.65;
  if(G.sel==='scie'){
    const [dx,dy]=DIRS[dir], ox=(tx+.5)*T, oy=(ty+.5)*T;
    ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+dx*3*T,oy+dy*3*T); ctx.stroke(); ctx.restore();
    drawSawBlade(ctx,ox,oy,animT*.3);
  } else {
    if(G.sel==='flamme'||G.sel==='vent'){
      const fake={tx,ty,dir}, v=G.sel==='vent', len=rayLen(fake,v?6:3), R=rayRect(fake,len,v?0:7);
      ctx.fillStyle=v?'rgba(255,255,255,.6)':'rgba(240,138,36,.6)'; ctx.fillRect(R.x,R.y,R.w,R.h);
    }
    drawTrap(ctx,G.sel,tx*T,ty*T,dir,null);
  }
  ctx.restore();
  ctx.strokeStyle=err?TRAPPER_COLOR:'#2E8B57'; ctx.lineWidth=3; ctx.strokeRect(tx*T+1.5,ty*T+1.5,T-3,T-3);
  if(err&&err!=='Occupé'){
    ctx.font='13px Bungee'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.strokeStyle='#F1E4C8'; ctx.lineWidth=4; ctx.strokeText(err,(tx+.5)*T,ty*T-4);
    ctx.fillStyle=TRAPPER_COLOR; ctx.fillText(err,(tx+.5)*T,ty*T-4);
  }
}
function pill(text,x,y,size,fill,color){
  ctx.font=size+'px Bungee'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const mw=ctx.measureText(text).width||text.length*size*.6;
  const w=mw+size*1.2, h=size*1.7;
  ctx.fillStyle=fill; ctx.strokeStyle=INK; ctx.lineWidth=3; rr(ctx,x-w/2,y-h/2,w,h,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle=color; ctx.fillText(text,x,y+1);
}
function render(){
  if(!ctx) return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bg,0,0);
  if(!G){ ctx.drawImage(tc,0,0); return; }
  const sh=reduceMotion?0:G.shake;
  if(sh) ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  if(G.phase==='place') drawPlacement();
  ctx.drawImage(tc,0,0);
  drawFlag();
  drawTraps();
  ctx.fillStyle='#3A3532';
  for(const b of G.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,6,0,Math.PI*2); ctx.fill(); }
  drawAnvils();
  for(const r of G.runners) drawRunner(r);
  if(G.phase==='place') drawPlacementTop();
  for(const p of G.parts){ ctx.globalAlpha=clamp(p.life/.5,0,1); ctx.fillStyle=p.color; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); }
  ctx.globalAlpha=1;
  ctx.setTransform(1,0,0,1,0,0);
  if(G.phase==='place'){
    pill('Pose '+Math.ceil(G.timer)+' s',WW/2,30,20,TRAPPER_COLOR,'#fff');
  }else if(G.phase==='countdown'){
    pill(String(Math.max(1,Math.ceil(G.timer/.6))),WW/2,WH/2-40,54,'#F1E4C8',INK);
  }else if(G.phase==='run'){
    pill(Math.ceil(G.timer)+' s',WW/2,30,22,G.timer<10?TRAPPER_COLOR:'#F1E4C8',G.timer<10?'#fff':INK);
    if(G.timer>runTime()-1) pill('Partez',WW/2,WH/2-40,54,'#F1E4C8',INK);
    if(mouse.in){
      const k=1-G.anvilCd/anvilCdMax();
      if(G.anvilCd<=0){ ctx.strokeStyle='rgba(194,54,47,.4)'; ctx.lineWidth=2; ctx.setLineDash([5,7]); ctx.beginPath(); ctx.moveTo(mouse.x,0); ctx.lineTo(mouse.x,WH); ctx.stroke(); ctx.setLineDash([]); }
      ctx.strokeStyle=INK; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,14,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle=k>=1?TRAPPER_COLOR:'#F1E4C8'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,14,-Math.PI/2,-Math.PI/2+Math.PI*2*k); ctx.stroke();
    }
  }
  if(G.toast) pill(G.toast.text,WW/2,76,16,'#F2C14E',INK);
}

  showOverlay('<div class="sheet"><h2>Bilan de la manche '+G.round+'</h2>'+
    '<table class="res">'+rows+'</table>'+
    '<div class="pts"><div>Coureurs <b>+'+L.fin+'</b></div><div>Piégeur <b>+'+L.tPts+'</b></div></div>'+
    (L.note?'<p>'+L.note+'</p>':'')+
    '<div class="row-end"><button class="btn" data-act="cont">'+(G.round>=cfg.rounds?'Voir le résultat':'Manche suivante')+'</button></div></div>');
}
function renderOver(){
  const a=G.teamScore,b=G.trapper.score;
  const title=a>b?'Les coureurs gagnent':b>a?'Le piégeur gagne':'Égalité';
  showOverlay('<div class="sheet"><h2>'+title+'</h2><p>Coureurs '+a+', piégeur '+b+'.</p>'+
    G.runners.map(r=>'<p class="augl"><b style="color:'+r.color+'">J'+(r.id+1)+' '+r.name+'</b> : '+augList(r.aug,RAUG)+'</p>').join('')+
    '<p class="augl"><b style="color:var(--trap)">Piégeur</b> : '+augList(G.trapper.aug,TAUG)+'</p>'+
    '<div class="row-end"><button class="btn alt" data-act="menu">Menu</button><button class="btn" data-act="again">Revanche</button></div></div>');
}
function renderHud(){
  const n=G?G.runners.length:cfg.runners;
  $('#rdots').innerHTML=COLORS.slice(0,n).map(c=>'<i style="background:'+c+'"></i>').join('');
  $('#sR').textContent=G?G.teamScore:0;
  $('#sT').textContent=G?G.trapper.score:0;
  const P={draft:'Améliorations',place:'Pose des pièges',countdown:'Course',run:'Course',result:'Bilan',over:'Fin de partie'};
  $('#mid').innerHTML=G?'Manche '+G.round+' sur '+cfg.rounds+'<small>'+P[G.phase]+', carte '+G.map.name+'</small>':'Traquenard<small>Menu</small>';
}
function renderDock(){
  if(G&&G.phase==='place'){
    const tp=G.trapper;
    let h='<div class="budget">Points<b>'+tp.points+'</b></div>';
    TORDER.filter(t=>tp.unlocked.has(t)).forEach((t,i)=>{
      const c=costOf(t);
      h+='<button class="tool" data-act="tool" data-type="'+t+'" aria-pressed="'+(G.sel===t)+'" title="Touche '+(i+1)+'"><canvas width="40" height="40" data-icon="'+t+'"></canvas><span>'+TRAPS[t].name+'</span><em>'+(c===0?'Gratuit':c+' pt'+(c>1?'s':''))+'</em></button>';
    });
    h+='<div class="hint">R ou molette : pivoter<br>Clic droit : retirer</div>';
    h+='<button class="btn" data-act="go">Lancer la course</button>';
    dock.innerHTML=h;
    dock.querySelectorAll('canvas[data-icon]').forEach(c=>{
      const x=c.getContext('2d'); if(!x) return;
      const t=c.dataset.icon;
      x.translate(4,4);
      drawTrap(x,t,0,0,TRAPS[t].rot?G.dir:0,null);
    });
    return;
  }
  const n=G?G.runners.length:cfg.runners;
  let h='<div class="legend">';
  for(let i=0;i<n;i++) h+='<span><i style="background:'+COLORS[i]+'"></i>J'+(i+1)+' : '+SCHEMES[i].txt+'</span>';
  h+='<span><i style="background:var(--trap)"></i>'+(G&&(G.phase==='run'||G.phase==='countdown')?'Piégeur : clic pour lâcher une enclume':'Piégeur : souris')+'</span></div>';
  dock.innerHTML=h;
}

function fit(){
  const s=$('#stage'); const aw=s.clientWidth-28, ah=s.clientHeight-28;
  let w=aw, h=w*WH/WW; if(h>ah){ h=ah; w=h*WW/WH; }
  cv.style.width=Math.max(200,w)+'px'; cv.style.height=Math.max(110,h)+'px';
}
addEventListener('resize',fit);

drawBackground();
buildTerrain(MAPS.atelier);
fit(); renderHud(); showMenu();
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(G&&G.phase==='place') renderDock(); });
</script>
</body>
</html>
